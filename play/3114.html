            drawAnimePortrait(opp.id, W - 220, 200, 1.1, true);
            ctx.fillStyle = '#fb7185';
            ctx.font = '900 23px "Noto Sans KR", sans-serif';
            ctx.fillText(`${gameMode === 'PVP' ? '2P' : 'CPU'} ${opp.name}`, W - 220, 332);
            ctx.fillStyle = '#e4e4e7';
            ctx.font = '700 13px "Noto Sans KR", sans-serif';
            ctx.fillText(`${opp.age} | ${opp.height} / ${opp.weight}`, W - 220, 356);
            ctx.fillText(`유파: ${opp.style}`, W - 220, 377);
            ctx.fillStyle = '#fda4af';
            ctx.fillText(`★ 특성 [${opp.traitName}]`, W - 220, 400);
            ctx.fillStyle = '#d4d4d8';
            ctx.font = '400 11px "Noto Sans KR", sans-serif';
            ctx.fillText(opp.traitDesc, W - 220, 418);
            ctx.fillStyle = '#fde047';
            ctx.font = '700 13px "Noto Sans KR", sans-serif';
            ctx.fillText(`필살기: ${opp.specialName}`, W - 220, 442);
            if (gameMode === 'PVP') {
                ctx.fillStyle = '#fda4af';
                ctx.font = '700 12px "Noto Sans KR", sans-serif';
                ctx.fillText('[2P 키] 이동: 방향키 | 주먹: N | 발: M | 가드: , | 필살: .', W - 220, 464);
            }

            // 중앙 VS 로고
            ctx.fillStyle = '#ef4444';
            ctx.font = '900 68px "Black Han Sans", sans-serif';
            ctx.fillText('VS', W / 2, 240);

            const pulse = 1 + Math.sin(stateTimer * 0.12) * 0.05;
            ctx.save();
            ctx.translate(W / 2, 495);
            ctx.scale(pulse, pulse);
            ctx.fillStyle = '#fde047';
            ctx.font = '900 20px "Noto Sans KR", sans-serif';
            ctx.fillText('▶ 클릭 또는 ENTER를 눌러 대결 시작!', 0, 0);
            ctx.restore();
        }

        // 필살기 발동 시 짤막한 컷신 애니메이션 렌더링
        function drawCutinScreen() {
            const atk = cutinData.attacker;
            if (!atk) return;

            ctx.fillStyle = '#09090b';
            ctx.fillRect(0, 0, W, H);

            // 집중선 이펙트
            ctx.save();
            ctx.translate(W / 2, H / 2);
            for (let i = 0; i < 36; i++) {
                const ang = (i / 36) * Math.PI * 2 + cutinData.timer * 0.04;
                ctx.strokeStyle = i % 2 === 0 ? atk.spec.themeColor : '#fde047';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang) * 90, Math.sin(ang) * 90);
                ctx.lineTo(Math.cos(ang) * 600, Math.sin(ang) * 600);
                ctx.stroke();
            }
            ctx.restore();

            // 클로즈업 캐릭터 포트레이트 슬라이드 인
            const slideX = Math.min(280, cutinData.timer * 18);
            drawAnimePortrait(atk.spec.id, slideX, 250, 1.55, false);

            // 필살기 이름 & 설명 배너
            ctx.fillStyle = 'rgba(9, 9, 11, 0.88)';
            ctx.beginPath();
            ctx.roundRect(430, 150, 490, 210, 18);
            ctx.fill();
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.fillStyle = atk.spec.themeColor;
            ctx.font = '900 20px "Noto Sans KR", sans-serif';
            ctx.fillText(`${atk.spec.name} 필살 오의!`, 460, 195);

            ctx.fillStyle = '#fde047';
            ctx.font = '900 32px "Black Han Sans", sans-serif';
            ctx.fillText(atk.spec.specialName, 460, 242);

            ctx.fillStyle = '#f4f4f5';
            ctx.font = '700 15px "Noto Sans KR", sans-serif';
            const desc = atk.spec.specialDesc;
            ctx.fillText(desc.slice(0, 26), 460, 285);
            if (desc.length > 26) {
                ctx.fillText(desc.slice(26), 460, 312);
            }
        }

        // 전투 필드 캐릭터 스프라이트 렌더링 (사실적인 해부학적 인체/동물 체형 & 관절·근육 비율 작화!)
        function drawFighter(f) {
            ctx.save();
            ctx.translate(f.x, f.y);
            if (f.state === 'KO') {
                ctx.rotate(-f.facing * Math.PI / 2.2);
            }
            ctx.scale(f.facing, 1);

            const id = f.spec.id;
            const isCrouch = f.state === 'CROUCH';
            const bob = Math.sin(f.animFrame * 0.15) * 2.5;
            const bodyScaleY = isCrouch ? 0.74 : 1.0;

            // 캐릭터별 실제 키/몸무게 기반 정밀 인체 비례 파라미터
            let shoulderW = 22, waistW = 16, hipW = 18, torsoH = 62;
            let thighLen = 30, calfLen = 28, thighThick = 12, calfThick = 9;
            let upperArmLen = 28, foreArmLen = 26, armThick = 10;
            let headOffsetY = -142, headOffsetX = 0;
            let skinColor = '#fed7aa', topColor = f.spec.themeColor, pantsColor = '#1e293b';

            if (id === 'yejun' || id === 'dark_yejun') {
                // 176cm 89kg: 묵직한 체형 + 두툼한 복부·허벅지 + 앞으로 22px 굽은 거북목
                shoulderW = 24; waistW = 23; hipW = 22; torsoH = 60;
                thighLen = 28; calfLen = 26; thighThick = 14; calfThick = 11;
                upperArmLen = 26; foreArmLen = 25; armThick = 11;
                headOffsetX = 22; headOffsetY = -132;
                skinColor = id === 'dark_yejun' ? '#a8a29e' : '#fed7aa';
                topColor = id === 'dark_yejun' ? '#18181b' : '#1e293b'; // 교복 자켓
                pantsColor = id === 'dark_yejun' ? '#09090b' : '#334155'; // 교복 슬랙스
            } else if (id === 'kangaroo') {
                // 185cm 82kg: 넓은 하체·역관절 뒷다리·근육질 상체·긴 꼬리
                shoulderW = 20; waistW = 15; hipW = 22; torsoH = 64;
                thighLen = 32; calfLen = 32; thighThick = 15; calfThick = 9;
                upperArmLen = 24; foreArmLen = 24; armThick = 10;
                headOffsetX = 8; headOffsetY = -146;
                skinColor = '#ea580c'; topColor = '#ea580c'; pantsColor = '#991b1b';
            } else if (id === 'taepung') {
                // 181cm 71kg: 역삼각형 슬림 근육질 체형 + 길고 탄탄한 다리 + 도복
                shoulderW = 23; waistW = 15; hipW = 17; torsoH = 64;
                thighLen = 34; calfLen = 32; thighThick = 12; calfThick = 9;
                upperArmLen = 28; foreArmLen = 26; armThick = 10;
                headOffsetY = -150;
                topColor = '#f8fafc'; pantsColor = '#f1f5f9';
            } else if (id === 'bear') {
                // 215cm 195kg: 압도적 근육 거구 + 두꺼운 사지
                shoulderW = 36; waistW = 32; hipW = 30; torsoH = 78;
                thighLen = 32; calfLen = 28; thighThick = 21; calfThick = 16;
                upperArmLen = 34; foreArmLen = 32; armThick = 18;
                headOffsetX = 6; headOffsetY = -168;
                skinColor = '#18181b'; topColor = '#18181b'; pantsColor = '#09090b';
            } else if (id === 'crane') {
                // 198cm 42kg: 가늘고 긴 선인 체형 + 긴 목·다리
                shoulderW = 18; waistW = 12; hipW = 14; torsoH = 64;
                thighLen = 38; calfLen = 38; thighThick = 8; calfThick = 6;
                upperArmLen = 32; foreArmLen = 32; armThick = 7;
                headOffsetX = 6; headOffsetY = -168;
                skinColor = '#f8fafc'; topColor = '#f8fafc'; pantsColor = '#0f766e';
            } else if (id === 'geosan') {
                // 194cm 118kg: 헤비급 보디빌더급 떡대 & 두꺼운 팔다리
                shoulderW = 32; waistW = 25; hipW = 24; torsoH = 72;
                thighLen = 32; calfLen = 30; thighThick = 18; calfThick = 14;
                upperArmLen = 32; foreArmLen = 30; armThick = 15;
                headOffsetY = -156;
                topColor = '#1d4ed8'; pantsColor = '#1e40af';
            } else if (id === 'viper') {
                // 204cm 79kg: 초장신 마른 근육질 + 채찍 같은 긴 팔다리
                shoulderW = 21; waistW = 14; hipW = 16; torsoH = 70;
                thighLen = 38; calfLen = 36; thighThick = 11; calfThick = 8;
                upperArmLen = 36; foreArmLen = 34; armThick = 9;
                headOffsetY = -168;
                topColor = '#064e3b'; pantsColor = '#022c22';
            } else if (id === 'gwibi') {
                // 166cm 48kg: 날씬한 허리라인과 유려한 골반 비율의 여성 실루엣
                shoulderW = 15; waistW = 10; hipW = 16; torsoH = 54;
                thighLen = 28; calfLen = 26; thighThick = 9.5; calfThick = 7;
                upperArmLen = 23; foreArmLen = 22; armThick = 7;
                headOffsetY = -128;
                skinColor = '#fff1e6'; topColor = '#e11d48'; pantsColor = '#be123c';
            } else if (id === 'zara') {
                // 178cm 66kg: 탄탄하고 균형 잡힌 여성 운동선수 실루엣
                shoulderW = 19; waistW = 12; hipW = 18; torsoH = 60;
                thighLen = 32; calfLen = 30; thighThick = 11.5; calfThick = 8.5;
                upperArmLen = 26; foreArmLen = 25; armThick = 9;
                headOffsetY = -142;
                skinColor = '#7c4324'; topColor = '#f59e0b'; pantsColor = '#18181b';
            } else if (id === 'vending') {
                // 192cm 240kg: 육중한 직사각 강철 사물 바디 + 기계 유압 다리
                shoulderW = 34; waistW = 34; hipW = 34; torsoH = 88;
                thighLen = 22; calfLen = 20; thighThick = 14; calfThick = 14;
                upperArmLen = 26; foreArmLen = 24; armThick = 12;
                headOffsetY = -148;
                skinColor = '#94a3b8'; topColor = '#0284c7'; pantsColor = '#334155';
            } else if (id === 'tteokbokki') {
                // 162cm 35kg: 통통하고 쫄깃한 그릇형 바디
                shoulderW = 24; waistW = 26; hipW = 20; torsoH = 52;
                thighLen = 22; calfLen = 20; thighThick = 10; calfThick = 8;
                upperArmLen = 22; foreArmLen = 20; armThick = 8;
                headOffsetY = -118;
                skinColor = '#fffbeb'; topColor = '#dc2626'; pantsColor = '#18181b';
            }

            const hipY = -(thighLen + calfLen);
            const shoulderY = hipY - torsoH + bob;

            // 흑화 예준 상시 검붉은 투기 오라
            if (id === 'dark_yejun') {
                const aura = ctx.createRadialGradient(0, -85, 10, 0, -85, 95);
                aura.addColorStop(0, 'rgba(168, 85, 247, 0.45)');
                aura.addColorStop(0.6, 'rgba(220, 38, 38, 0.25)');
                aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = aura;
                ctx.beginPath();
                ctx.arc(0, -85, 95, 0, Math.PI * 2);
                ctx.fill();
            }

            // 바닥 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 0, shoulderW * 1.5, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.scale(1, bodyScaleY);

            // 관절 기반 팔/다리(허벅지-무릎-종아리-발) 그리기 헬퍼
            function drawLimb(x1, y1, mx, my, x2, y2, t1, t2, color, shoeColor) {
                ctx.strokeStyle = color;
                ctx.lineCap = 'round';
                ctx.lineWidth = t1;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(mx, my);
                ctx.stroke();

                ctx.lineWidth = t2;
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (shoeColor) {
                    ctx.fillStyle = shoeColor;
                    ctx.beginPath();
                    ctx.ellipse(x2 + 5, y2, t2 * 0.9, t2 * 0.48, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // [특징] 캥거루 굵고 탄력 있는 꼬리
            if (id === 'kangaroo') {
                ctx.strokeStyle = '#c2410c';
                ctx.lineWidth = 15;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-10, hipY + 4);
                ctx.quadraticCurveTo(-50, hipY + 28, -58, -5);
                ctx.stroke();
            }

            // [특징] 양귀비 휘날리는 긴 흑발 뒷머리
            if (id === 'gwibi') {
                ctx.fillStyle = '#09090b';
                ctx.beginPath();
                ctx.moveTo(-10, headOffsetY + 8);
                ctx.quadraticCurveTo(-42, -70, -28 + Math.sin(f.animFrame * 0.18) * 7, -28);
                ctx.lineTo(-6, -42);
                ctx.closePath();
                ctx.fill();
            }

            const walkCycle = f.state === 'WALK' ? Math.sin(f.animFrame * 0.28) : 0;
            const shoeCol = (id === 'kangaroo' || id === 'bear' || id === 'crane') ? null : (id === 'gwibi' ? '#881337' : '#0f172a');

            // 1) 뒷다리 (무릎 관절 굴곡 포함)
            const backKneeX = -6 - walkCycle * 12;
            const backKneeY = hipY + thighLen * 0.95;
            const backFootX = -12 - walkCycle * 18;
            drawLimb(-5, hipY, backKneeX, backKneeY, backFootX, -5, thighThick, calfThick, pantsColor, shoeCol);

            // 2) 앞다리 (발차기 시 무릎 펴지며 하이킥/미들킥 동작)
            if (f.state === 'KICK' || f.state === 'SPECIAL') {
                const kickFootX = thighLen + calfLen + 22;
                const kickFootY = hipY - 24;
                drawLimb(6, hipY, (6 + kickFootX) * 0.5, (hipY + kickFootY) * 0.5 - 4, kickFootX, kickFootY, thighThick, calfThick, pantsColor, shoeCol);
            } else {
                const frontKneeX = 12 + walkCycle * 14;
                const frontKneeY = hipY + thighLen * 0.92;
                const frontFootX = 14 + walkCycle * 18;
                drawLimb(6, hipY, frontKneeX, frontKneeY, frontFootX, -5, thighThick, calfThick, pantsColor, shoeCol);
            }

            // 3) 해부학적 상체 토르소 (어깨-허리-골반 실루엣)
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(-shoulderW, shoulderY);
            ctx.lineTo(shoulderW, shoulderY);
            ctx.quadraticCurveTo(waistW, shoulderY + torsoH * 0.55, hipW, hipY + 4);
            ctx.lineTo(-hipW, hipY + 4);
            ctx.quadraticCurveTo(-waistW, shoulderY + torsoH * 0.55, -shoulderW, shoulderY);
            ctx.closePath();
            ctx.fill();

            // 복장/체형 디테일
            if (id === 'yejun' || id === 'dark_yejun') {
                // 교복 셔츠 V넥 & 넥타이 & 단추
                ctx.fillStyle = id === 'dark_yejun' ? '#27272a' : '#f8fafc';
                ctx.beginPath();
                ctx.moveTo(-6, shoulderY);
                ctx.lineTo(14, shoulderY);
                ctx.lineTo(6, shoulderY + 24);
                ctx.fill();
                ctx.fillStyle = id === 'dark_yejun' ? '#a855f7' : '#dc2626';
                ctx.fillRect(3, shoulderY + 6, 4, 22);
            } else if (id === 'taepung' || id === 'geosan') {
                // 도복 띠 (검은띠)
                ctx.fillStyle = '#09090b';
                ctx.fillRect(-waistW, shoulderY + torsoH * 0.54, waistW * 2, 6);
            } else if (id === 'bear') {
                // 반달가슴곰 가슴 반달무늬
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(10, shoulderY + 28, 16, 0.3, Math.PI - 0.3);
                ctx.stroke();
            } else if (id === 'gwibi') {
                // 치파오/드레스 슬릿 스커트 자락
                ctx.fillStyle = '#be123c';
                ctx.beginPath();
                ctx.moveTo(-hipW, hipY);
                ctx.lineTo(hipW, hipY);
                ctx.lineTo(hipW + 8, hipY + 34);
                ctx.lineTo(-hipW - 6, hipY + 34);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 4) 목 연결 (오예준 거북목 각도 강조)
            ctx.strokeStyle = skinColor;
            ctx.lineWidth = id === 'bear' ? 20 : (id === 'gwibi' ? 8 : 11);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(4, shoulderY + 4);
            ctx.lineTo(headOffsetX, headOffsetY + 14 + bob);
            ctx.stroke();

            // 5) 애니메이션 얼굴 포트레이트
            ctx.save();
            ctx.translate(headOffsetX, headOffsetY + bob);
            const headScale = id === 'bear' ? 0.46 : (id === 'gwibi' ? 0.38 : 0.42);
            ctx.scale(headScale, headScale);
            drawAnimePortrait(id, 0, 0, 1, false);
            ctx.restore();

            // 6) 상완-팔꿈치-전완-주먹 관절 팔 렌더링
            if (id === 'crane') {
                // 백학도사 날개 팔
                ctx.fillStyle = '#f8fafc';
                ctx.strokeStyle = '#0d9488';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, shoulderY + 10);
                if (f.state === 'PUNCH' || f.state === 'KICK' || f.state === 'SPECIAL') {
                    ctx.quadraticCurveTo(45, shoulderY - 25, upperArmLen + foreArmLen + 20, shoulderY + 8);
                    ctx.lineTo(22, shoulderY + 26);
                } else {
                    ctx.quadraticCurveTo(-36, shoulderY - 6, -44, shoulderY + 36);
                    ctx.lineTo(8, shoulderY + 26);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else {
                const armCol = (id === 'yejun' || id === 'dark_yejun' || id === 'taepung' || id === 'geosan' || id === 'viper') ? topColor : skinColor;
                let elbowX = 4, elbowY = shoulderY + upperArmLen;
                let handX = 24, handY = shoulderY + upperArmLen - 4;

                if (f.state === 'PUNCH' || f.state === 'SPECIAL') {
                    elbowX = shoulderW + upperArmLen * 0.7;
                    elbowY = shoulderY + 6;
                    handX = shoulderW + upperArmLen + foreArmLen + 8;
                    handY = shoulderY + 4;
                } else if (f.state === 'BLOCK') {
                    elbowX = 22;
                    elbowY = shoulderY + 14;
                    handX = 28;
                    handY = shoulderY - 14;
                }

                drawLimb(8, shoulderY + 8, elbowX, elbowY, handX, handY, armThick, armThick * 0.85, armCol, null);

                // 주먹 / 복싱 글러브
                ctx.fillStyle = id === 'kangaroo' ? '#dc2626' : skinColor;
                ctx.beginPath();
                ctx.arc(handX, handY, id === 'kangaroo' ? 11 : armThick * 0.72, 0, Math.PI * 2);
                ctx.fill();
            }

            // 가드 실드 표시
            if (f.state === 'BLOCK') {
                ctx.strokeStyle = '#60a5fa';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(32, -95, 42, -Math.PI * 0.4, Math.PI * 0.4);
                ctx.stroke();
            }

            // 반격 찬스 오라 표시 (예준 HP 30% 이하 각성 시 황금-적색 이중 오라)
            if (f.guardCounterTimer > 0) {
                const isAwake = id === 'yejun' && (f.hp / f.maxHp) <= 0.30;
                ctx.strokeStyle = isAwake ? '#fde047' : 'rgba(239, 68, 68, 0.85)';
                ctx.lineWidth = isAwake ? 4.5 : 3;
                ctx.beginPath();
                ctx.arc(0, -85, 58 + Math.sin(f.animFrame * 0.5) * 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 화상(BURN) 상태 시각적 불꽃 오라
            if (f.burnTimer > 0) {
                const fireGlow = ctx.createRadialGradient(0, -80, 10, 0, -80, 68);
                fireGlow.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
                fireGlow.addColorStop(0.6, 'rgba(239, 68, 68, 0.3)');
                fireGlow.addColorStop(1, 'rgba(239, 68, 68, 0)');
                ctx.fillStyle = fireGlow;
                ctx.beginPath();
                ctx.arc(0, -80, 68, 0, Math.PI * 2);
                ctx.fill();
            }

            // 감전 / 매혹 CC기 상태 아이콘 표시
            if (f.charmTimer > 0) {
                ctx.save();
                ctx.scale(f.facing, 1);
                ctx.font = '900 16px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = f.ccType === 'SHOCK' ? '#fde047' : '#fb7185';
                ctx.fillText(f.ccType === 'SHOCK' ? '⚡ 감전됨!' : '💖 매혹됨!', 0, -172);
                ctx.restore();
            }

            ctx.restore();
        }

        // 스테이지 클리어 / 패배 결과 오버레이
        function drawResultOverlay(isWin) {
            ctx.fillStyle = 'rgba(9, 9, 11, 0.84)';
            ctx.fillRect(0, 0, W, H);

            if (gameMode !== 'STORY') {
                // FREE 모드 / 2인용 모드 전용 승패 결과창
                const winner = isWin ? player : enemy;
                const winnerTag = gameMode === 'PVP' ? (isWin ? '1P 승리!' : '2P 승리!') : (isWin ? 'PLAYER WIN!' : 'CPU WIN!');
                drawAnimePortrait(winner.spec.id, 220, 265, 1.15, false);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#fde047';
                ctx.font = '900 52px "Black Han Sans", sans-serif';
                ctx.fillText(winnerTag, W / 2 + 80, 155);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 24px "Noto Sans KR", sans-serif';
                ctx.fillText(`승자: ${winner.spec.name}`, W / 2 + 80, 215);

                ctx.fillStyle = '#93c5fd';
                ctx.font = '700 18px "Noto Sans KR", sans-serif';
                ctx.fillText('▶ 클릭 / ENTER : 캐릭터 다시 선택하기', W / 2 + 80, 305);

                ctx.fillStyle = '#fca5a5';
                ctx.font = '700 15px "Noto Sans KR", sans-serif';
                ctx.fillText('(상단 [🏠 메인 메뉴] 버튼으로 다른 모드 선택 가능)', W / 2 + 80, 355);
                return;
            }

            const stage = STAGES[currentStageIdx];
            drawAnimePortrait('yejun', 210, 270, 1.15, false);

            ctx.textAlign = 'center';
            ctx.fillStyle = isWin ? '#fde047' : '#ef4444';
            ctx.font = '900 54px "Black Han Sans", sans-serif';
            ctx.fillText(isWin ? 'STAGE CLEAR!' : 'YOU LOSE...', W / 2 + 70, 145);

            // 오예준 대사 말풍선
            ctx.fillStyle = '#18181b';
            ctx.beginPath();
            ctx.roundRect(350, 185, 540, 140, 16);
            ctx.fill();
            ctx.strokeStyle = isWin ? '#60a5fa' : '#f87171';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#93c5fd';
            ctx.font = '900 16px "Noto Sans KR", sans-serif';
            ctx.fillText(`오예준의 한마디`, W / 2 + 140, 218);

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 16px "Noto Sans KR", sans-serif';
            const quote = isWin ? stage.opponent.winQuote : stage.opponent.loseQuote;
            ctx.fillText(quote.slice(0, 32), W / 2 + 140, 255);
            if (quote.length > 32) {
                ctx.fillText(quote.slice(32), W / 2 + 140, 285);
            }

            ctx.fillStyle = '#fde047';
            ctx.font = '900 22px "Noto Sans KR", sans-serif';
            ctx.fillText(isWin ? '▶ 클릭 / ENTER로 다음 스테이지 진행' : '↻ 클릭 / ENTER로 다시 도전하기', W / 2 + 140, 385);
        }

        // ============================================================================
        // 7. 메인 업데이트 & 렌더링 루프
        // ============================================================================
        function update() {
            stateTimer++;
            if (screenShake > 0) screenShake--;

            if (hitStopFrames > 0) {
                hitStopFrames--;
                return;
            }

            if (gameState === 'ROUND_INTRO') {
                if (stateTimer >= 65) {
                    gameState = 'FIGHT';
                    stateTimer = 0;
                }
            } else if (gameState === 'CUTIN') {
                cutinData.timer++;
                if (cutinData.timer >= cutinData.duration) {
                    cutinData.active = false;
                    gameState = 'FIGHT';
                }
            } else if (gameState === 'FIGHT') {
                roundTick++;
                if (roundTick >= 60) {
                    roundTick = 0;
                    if (roundTimer > 0) roundTimer--;
                }

                handlePlayerControl();
                handleEnemyAI();

                player.update(enemy);
                enemy.update(player);

                // 화면 경계 제한
                player.x = Math.max(60, Math.min(W - 60, player.x));
                enemy.x = Math.max(60, Math.min(W - 60, enemy.x));

                // 파티클 업데이트
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.isFire) {
                        p.vy -= 0.08; // 불꽃은 위로 타오름
                        p.size *= 0.96;
                    } else {
                        p.vy += 0.25;
                    }
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                // 흑섬 전격 스파크 업데이트
                for (let i = blackFlashBolts.length - 1; i >= 0; i--) {
                    blackFlashBolts[i].life--;
                    if (blackFlashBolts[i].life <= 0) blackFlashBolts.splice(i, 1);
                }

                // 플로팅 텍스트 업데이트
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.y -= 1.1;
                    ft.life--;
                    if (ft.life <= 0) floatingTexts.splice(i, 1);
                }

                // 승패 판정
                if (enemy.state === 'KO' && stateTimer > 45) {
                    if (gameMode === 'STORY' && currentStageIdx >= STAGES.length - 1) {
                        startEnding();
                    } else {
                        gameState = 'STAGE_CLEAR';
                        stateTimer = 0;
                    }
                } else if ((player.state === 'KO' || roundTimer <= 0) && stateTimer > 45) {
                    gameState = 'GAME_OVER';
                    stateTimer = 0;
                }
            }
        }

        function render() {
            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }

            if (gameState === 'TITLE') {
                drawTitleScreen();
            } else if (gameState === 'CHAR_SELECT') {
                drawCharSelectScreen();
            } else if (gameState === 'STORY') {
                drawStoryScreen();
            } else if (gameState === 'VERSUS') {
                drawVersusScreen();
            } else if (gameState === 'ENDING') {
                drawEndingAnimation();
            } else if (gameState === 'CUTIN') {
                drawCutinScreen();
            } else {
                // ROUND_INTRO, FIGHT, STAGE_CLEAR, GAME_OVER
                const activeStage = gameMode === 'STORY' ? STAGES[currentStageIdx] : STAGES[selectedArenaIdx];
                drawArenaBackground(activeStage.bgTheme);
                drawFighter(player);
                drawFighter(enemy);

                // 일반 파티클 렌더링
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 흑섬(黑閃) 붉고 검은 전격 스파크 렌더링
                blackFlashBolts.forEach(bolt => {
                    const alpha = bolt.life / bolt.maxLife;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // 붉은 외곽 광채
                    ctx.strokeStyle = '#dc2626';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    bolt.pts.forEach((pt, idx) => {
                        if (idx === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    });
                    ctx.stroke();

                    // 칠흑 같은 검은 중심 번개
                    ctx.strokeStyle = '#09090b';
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 3.2;
                    ctx.stroke();
                    ctx.restore();
                });

                // 데미지 및 특성 플로팅 텍스트
                floatingTexts.forEach(ft => {
                    ctx.fillStyle = ft.color;
                    ctx.font = '900 18px "Noto Sans KR", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                });

                drawHUD();

                if (gameState === 'ROUND_INTRO') {
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#fde047';
                    ctx.font = '900 64px "Black Han Sans", sans-serif';
                    const introTitle = gameMode === 'STORY'
                        ? `STAGE ${activeStage.stageNum}`
                        : (gameMode === 'PVP' ? '1P VS 2P' : 'FREE MATCH');
                    ctx.fillText(stateTimer < 40 ? introTitle : 'FIGHT!!', W / 2, H / 2 + 15);
                } else if (gameState === 'STAGE_CLEAR') {
                    drawResultOverlay(true);
                } else if (gameState === 'GAME_OVER') {
                    drawResultOverlay(false);
                }
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================================
        // 8. 입력 및 이벤트 바인딩
        // ============================================================================
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (W / rect.width),
                y: (clientY - rect.top) * (H / rect.height)
            };
        }

        function handleCanvasClick(e) {
            sfx.init();
            const pt = getCanvasCoords(e);

            if (gameState === 'TITLE') {
                for (const btn of TITLE_MODE_BUTTONS) {
                    if (pt.x >= W / 2 - 190 && pt.x <= W / 2 + 190 && pt.y >= btn.y - 28 && pt.y <= btn.y + 30) {
                        if (btn.mode === 'STORY') startStory();
                        else startCharSelect(btn.mode);
                        return;
                    }
                }
                return;
            }

            if (gameState === 'CHAR_SELECT') {
                // 1) 좌측 1P 카드 클릭 시 1P 선택 턴으로 전환
                if (pt.x >= 20 && pt.x <= 250 && pt.y >= 72 && pt.y <= 427) {
                    selectTurn = 1;
                    sfx.playSelect();
                    return;
                }
                // 2) 우측 2P/CPU 카드 클릭 시 2P 선택 턴으로 전환
                if (pt.x >= W - 250 && pt.x <= W - 20 && pt.y >= 72 && pt.y <= 427) {
                    selectTurn = 2;
                    sfx.playSelect();
                    return;
                }
                // 3) 중앙 12명 캐릭터 그리드 클릭
                const gridStartX = 268, gridStartY = 74, cellW = 102, cellH = 112, gap = 6;
                for (let idx = 0; idx < ALL_FIGHTERS.length; idx++) {
                    const col = idx % 4;
                    const row = Math.floor(idx / 4);
                    const cx = gridStartX + col * (cellW + gap);
                    const cy = gridStartY + row * (cellH + gap);
                    if (pt.x >= cx && pt.x <= cx + cellW && pt.y >= cy && pt.y <= cy + cellH) {
                        sfx.playSelect();
                        if (selectTurn === 1) {
                            p1SelectedIdx = idx;
                            selectTurn = 2;
                        } else {
                            p2SelectedIdx = idx;
                            selectTurn = 1;
                        }
                        return;
                    }
                }
                // 4) 배경 스테이지 변경 바 클릭
                if (pt.x >= 120 && pt.x <= 480 && pt.y >= 448 && pt.y <= 496) {
                    selectedArenaIdx = (selectedArenaIdx + 1) % STAGES.length;
                    sfx.playSelect();
                    return;
                }
                // 5) 대결 시작 버튼 클릭
                if (pt.x >= 510 && pt.x <= 840 && pt.y >= 444 && pt.y <= 500) {
                    startStageVersus(selectedArenaIdx);
                    return;
                }
                return;
            }

            advanceScreenAction();
        }

        function advanceScreenAction() {
            sfx.init();
            if (gameState === 'STORY') {
                sfx.playSelect();
                storySlideIdx++;
                stateTimer = 0;
                if (storySlideIdx >= 4) {
                    startStageVersus(0);
                }
            } else if (gameState === 'VERSUS') {
                startRoundIntro();
            } else if (gameState === 'STAGE_CLEAR') {
                if (gameMode === 'STORY') startStageVersus(currentStageIdx + 1);
                else startCharSelect(gameMode);
            } else if (gameState === 'GAME_OVER') {
                if (gameMode === 'STORY') startStageVersus(currentStageIdx);
                else startCharSelect(gameMode);
            } else if (gameState === 'ENDING') {
                sfx.playSelect();
                endingSlideIdx++;
                stateTimer = 0;
                if (endingSlideIdx >= 3) {
                    goToTitle();
                }
            }
        }

        canvas.addEventListener('click', handleCanvasClick);

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (gameState === 'TITLE') {
                if (e.code === 'Digit1' || e.code === 'Enter') { sfx.init(); startStory(); }
                else if (e.code === 'Digit2') { sfx.init(); startCharSelect('FREE'); }
                else if (e.code === 'Digit3') { sfx.init(); startCharSelect('PVP'); }
                return;
            }
            if (gameState === 'CHAR_SELECT') {
                if (e.code === 'Enter') { sfx.init(); startStageVersus(selectedArenaIdx); }
                return;
            }
            if (e.code === 'Enter' && gameState !== 'FIGHT') {
                advanceScreenAction();
                return;
            }
            if (gameState === 'FIGHT') {
                if (gameMode === 'PVP') {
                    // 1P 스킬키 (Z, X, V)
                    if (player) {
                        if (e.code === 'KeyZ') player.startAttack('PUNCH');
                        if (e.code === 'KeyX') player.startAttack('KICK');
                        if (e.code === 'KeyV') player.startAttack('SPECIAL');
                    }
                    // 2P 스킬키 (N/Num1, M/Num2, ./Num0)
                    if (enemy) {
                        if (e.code === 'KeyN' || e.code === 'Numpad1') enemy.startAttack('PUNCH');
                        if (e.code === 'KeyM' || e.code === 'Numpad2') enemy.startAttack('KICK');
                        if (e.code === 'Period' || e.code === 'Numpad0') enemy.startAttack('SPECIAL');
                    }
                } else if (player) {
                    if (e.code === 'KeyJ' || e.code === 'KeyZ') player.startAttack('PUNCH');
                    if (e.code === 'KeyK' || e.code === 'KeyX') player.startAttack('KICK');
                    if (e.code === 'KeyL' || e.code === 'KeyC') player.startAttack('SPECIAL');
                }
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        // 하단 터치/마우스 버튼 바인딩
        document.querySelectorAll('.ctrl-btn').forEach(btn => {
            const code = btn.getAttribute('data-key');
            const press = (e) => {
                e.preventDefault();
                sfx.init();
                keys[code] = true;
                btn.classList.add('active');
                if (gameState === 'FIGHT' && player) {
                    if (code === 'KeyJ') player.startAttack('PUNCH');
                    if (code === 'KeyK') player.startAttack('KICK');
                    if (code === 'KeyL') player.startAttack('SPECIAL');
                }
            };
            const release = (e) => {
                e.preventDefault();
                keys[code] = false;
                btn.classList.remove('active');
            };
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
        });

        document.getElementById('btn-home').addEventListener('click', () => {
            goToTitle();
        });

        document.getElementById('btn-skip-story').addEventListener('click', () => {
            sfx.playSelect();
            startStageVersus(0);
        });

        const btnSound = document.getElementById('btn-sound');
        btnSound.addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            btnSound.textContent = sfx.enabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
            if (sfx.enabled) sfx.playSelect();
        });

        // 게임 시작
        window.onload = function () {
            gameLoop();
        };
    </script>
</body>
</html>
