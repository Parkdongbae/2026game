        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #09090b;
            color: #ffffff;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .font-arcade {
            font-family: 'Black Han Sans', sans-serif;
            letter-spacing: 0.04em;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16 / 9;
            max-height: 75vh;
            background: #111827;
            border: 3px solid #374151;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(239, 68, 68, 0.25);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .arcade-btn {
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border: 2px solid #6b7280;
            box-shadow: 0 4px 0 #111827, inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .arcade-btn:active, .arcade-btn.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #111827;
        }
        .arcade-btn-red {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            border-color: #fca5a5;
            box-shadow: 0 4px 0 #7f1d1d, inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .arcade-btn-yellow {
            background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
            border-color: #fde68a;
            box-shadow: 0 4px 0 #78350f, inset 0 1px 0 rgba(255,255,255,0.3);
        }

            background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%);
            border-color: #e9d5ff;
            box-shadow: 0 4px 0 #4c1d95, inset 0 1px 0 rgba(255,255,255,0.4);

            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: #bfdbfe;
            box-shadow: 0 4px 0 #1e3a8a, inset 0 1px 0 rgba(255,255,255,0.3);
        }

            0%, 100% { box-shadow: 0 0 10px #a855f7, 0 4px 0 #4c1d95; }
            50% { box-shadow: 0 0 24px #e879f9, 0 4px 0 #4c1d95; }
        }
        .special-ready {
            animation: pulseGlow 1s infinite;

        // ============================================================================
        // 1. Web Audio API 기반 오락실 레트로 사운드 엔진
        // ============================================================================
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, vol = 0.15, slideFreq = null) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playSelect() { this.playTone(520, 'square', 0.08, 0.1, 780); }
            playPunch() { this.playTone(180, 'triangle', 0.12, 0.2, 60); }
            playKick() { this.playTone(140, 'sawtooth', 0.16, 0.22, 45); }
            playBlock() { this.playTone(320, 'square', 0.09, 0.15, 220); }
            playSpecialCutin() {
                this.playTone(260, 'sawtooth', 0.45, 0.22, 880);
                setTimeout(() => this.playTone(520, 'square', 0.4, 0.2, 1040), 120);
            }
            playSpecialHit() {
                this.playTone(110, 'sawtooth', 0.45, 0.3, 30);
                this.playTone(220, 'square', 0.35, 0.25, 55);
            }
            playBlackFlash() {
                this.playTone(65, 'sawtooth', 0.55, 0.35, 22);
                this.playTone(980, 'square', 0.18, 0.25, 140);
                setTimeout(() => this.playTone(1320, 'sawtooth', 0.25, 0.25, 80), 60);
            }
            playKO() {
                this.playTone(300, 'sawtooth', 0.6, 0.25, 55);
            }
        }

        class Fighter {
            constructor(spec, x, facing, isPlayer = false) {
                this.spec = spec;
                this.isPlayer = isPlayer;
                this.x = x;

                this.vx = 0;

                this.burnTimer = 0; // 불닭왕 떡볶이 캡사이신 화상 지속피해 타이머
                this.charmTimer = 0; // 양귀비 [매혹] / 자라 [감전] 행동 불능 타이머
                this.ccType = null; // 'CHARM' | 'SHOCK'
            }

            get isGrounded() {
                return this.y >= GROUND_Y;
            }

            canAct() {
                if (this.charmTimer > 0) return false;
                return ['IDLE', 'WALK', 'CROUCH', 'BLOCK'].includes(this.state);
            }

            startAttack(type) {
                if (!this.canAct() && !(this.state === 'JUMP' && type !== 'SPECIAL')) return;

                if (type === 'SPECIAL') {
                    if (this.gauge < this.maxGauge) return;
                    this.gauge = 0;
                    this.state = 'SPECIAL';
                    this.stateTime = 0;
                    this.attackHitApplied = false;
                    triggerSpecialCutin(this);
                    return;
                }

                this.state = type; // PUNCH or KICK
                this.stateTime = 0;
                this.attackHitApplied = false;
                if (type === 'PUNCH') sfx.playPunch();
                else sfx.playKick();
            }

            takeDamage(dmg, knockbackX, isSpecial = false) {
                if (this.state === 'KO') return false;

                // [단독 특성: 백학도사 20% / 자라 18% 회피]
                const dodgeRate = this.spec.id === 'crane' ? 0.20 : (this.spec.id === 'zara' ? 0.18 : 0);
                if (dodgeRate > 0 && !isSpecial && Math.random() < dodgeRate) {
                    this.vx = -this.facing * 6;

                    return false;
                }

                // [특성: 불닭왕 떡볶이 - 쫄깃 탄성] 피격 시 22% 확률로 튕겨내며 기 +15 회복
                if (this.spec.id === 'tteokbokki' && !isSpecial && Math.random() < 0.22) {
                    this.gauge = Math.min(this.maxGauge, this.gauge + 15);
                    this.vx = -this.facing * 7;
                    spawnParticles(this.x, this.y - 80, '#ef4444', 12);
                    addFloatingText(this.x, this.y - 145, '🍡 쫄깃 탄성 바운스!', '#f87171');
                }

                // [특성: 자판기 V-900 - 잔돈 반환 반사] 피격 시 25% 확률로 캔 사출 반격
                if (this.spec.id === 'vending' && !isSpecial && Math.random() < 0.25) {
                    const attacker = this.isPlayer ? enemy : player;
                    if (attacker && attacker.state !== 'KO') {
                        attacker.hp = Math.max(1, attacker.hp - 15);
                        spawnParticles(attacker.x, attacker.y - 85, '#38bdf8', 10);
                        addFloatingText(attacker.x, attacker.y - 145, '🥫 캔 사출 반격 -15!', '#38bdf8');
                    }
                }

                // 가드 판정 (필살기 45% 관통, 박거산은 강철 잡기 특성으로 일반 공격도 45% 관통)
                if (this.state === 'BLOCK' && !isSpecial) {
                    const isGeosanBreak = (enemy && this.isPlayer && enemy.spec.id === 'geosan') || (!this.isPlayer && player && player.spec.id === 'geosan');
                    const chipRate = isGeosanBreak ? 0.45 : 0.15;
                    const chipDmg = Math.round(dmg * chipRate);
                    this.hp = Math.max(0, this.hp - chipDmg);
                    this.vx = knockbackX * 0.4;
                    this.gauge = Math.min(this.maxGauge, this.gauge + 8);
                    this.guardCounterTimer = 45; // 가드 직후 반격 찬스 활성화
                    sfx.playBlock();
                    spawnParticles(this.x + this.facing * 25, this.y - 90, isGeosanBreak ? '#f59e0b' : '#60a5fa', 10);
                    addFloatingText(this.x, this.y - 140, isGeosanBreak ? '💥 가드 분쇄!' : 'GUARD! (반격 찬스)', isGeosanBreak ? '#fbbf24' : '#60a5fa');
                    return false;
                }

                let rawDmg = this.state === 'BLOCK' && isSpecial ? Math.round(dmg * 0.45) : dmg;
                // [단독 특성: 오예준 - 강철 거북목 맷집] 받는 모든 피해 15% 경감 & 넉백 저항
                if (this.spec.id === 'yejun') {
                    rawDmg = Math.round(rawDmg * 0.85);
                    knockbackX *= 0.75;
                }
                // [단독 특성: 반달왕 - 백두의 강철 가죽] 받는 일반 데미지 20% 경감 & 넉백 저항
                if (this.spec.id === 'bear' && !isSpecial) {
                    rawDmg = Math.round(rawDmg * 0.80);
                    knockbackX *= 0.5;
                }
                // [단독 특성: 자판기 V-900 - 강철 외장] 받는 일반 데미지 25% 경감 & 넉백 면역
                if (this.spec.id === 'vending' && !isSpecial) {
                    rawDmg = Math.round(rawDmg * 0.75);
                    knockbackX *= 0.2;
                }
                const finalDmg = rawDmg;

                this.hp = Math.max(0, this.hp - finalDmg);
                this.vx = knockbackX;
                if (isSpecial) this.vy = -7;

                this.gauge = Math.min(this.maxGauge, this.gauge + 14);
                screenShake = isSpecial ? 18 : 7;
                hitStopFrames = isSpecial ? 8 : 3;

                if (isSpecial) sfx.playSpecialHit();
                else sfx.playKick();

                spawnParticles(this.x, this.y - 85, isSpecial ? '#facc15' : '#ef4444', isSpecial ? 28 : 14);
                addFloatingText(this.x, this.y - 145, `-${finalDmg}`, isSpecial ? '#fde047' : '#f87171');

                if (this.hp <= 0) {
                    this.state = 'KO';
                    this.vy = -9;
                    this.vx = -this.facing * 7;
                    sfx.playKO();
                } else {
                    this.state = 'HURT';
                    // [추가 특성: 박거산 - 철벽 부동심] 일반 피격 경직 시간 50% 단축
                    this.stateTime = (this.spec.id === 'geosan' && !isSpecial) ? 8 : 0;
                }
                return true;
            }

            update(opponent) {
                this.animFrame++;
                this.stateTime++;

                // 매 프레임 타이머 감소 (스턴/매혹/가드반격 영구 지속 버그 수정)
                if (this.charmTimer > 0) {
                    this.charmTimer--;
                    if (this.charmTimer === 0) this.ccType = null;
                }
                if (this.guardCounterTimer > 0) {
                    this.guardCounterTimer--;
                }

                // [단독 특성: 독사권 왕무영 맹독 지속 피해]
                if (this.poisonTimer > 0 && this.state !== 'KO') {
                    this.poisonTimer--;
                    if (this.poisonTimer % 30 === 0) {
                        this.hp = Math.max(1, this.hp - 12);
                        spawnParticles(this.x, this.y - 80, '#10b981', 6);
                        addFloatingText(this.x, this.y - 135, '☠️ 맹독 -12', '#34d399');
                    }
                }

                // [단독 특성: 불닭왕 떡볶이 캡사이신 화상 전용 불꽃 임팩트 & 지속 피해]
                if (this.burnTimer > 0 && this.state !== 'KO') {
                    this.burnTimer--;
                    // 상시 피어오르는 불꽃 파티클
                    if (this.animFrame % 4 === 0) {
                        spawnFireParticles(this.x, this.y - 75, 2);
                    }
                    if (this.burnTimer % 30 === 0) {
                        this.hp = Math.max(1, this.hp - 14);
                        spawnFireParticles(this.x, this.y - 85, 10);
                        addFloatingText(this.x, this.y - 140, '🔥 캡사이신 화상 -14', '#fb923c');
                    }
                }

                if (this.comboTimer > 0) {
                    this.comboTimer--;
                    if (this.comboTimer === 0) this.comboCount = 0;
                }

                // [추가 특성: 백학도사 선계 호흡 / 흑화 예준 암흑 재생] 매 2초마다 HP 자동 회복
                if (this.state !== 'KO' && this.animFrame % 120 === 0 && this.hp < this.maxHp) {
                    if (this.spec.id === 'crane') {
                        this.hp = Math.min(this.maxHp, this.hp + 12);
                        addFloatingText(this.x, this.y - 140, '🍃 +12', '#2dd4bf');
                    } else if (this.spec.id === 'dark_yejun') {
                        this.hp = Math.min(this.maxHp, this.hp + 15);
                        addFloatingText(this.x, this.y - 140, '🌑 +15', '#c084fc');
                    }
                }

                // 기 게이지 자연 회복 (루키 1.6배, 자라 1.5배, 흑화 오예준 2배)
                const gaugeInterval = this.spec.id === 'dark_yejun' ? 6 : (this.spec.id === 'kangaroo' || this.spec.id === 'zara' ? 8 : 12);
                if (this.state !== 'KO' && this.animFrame % gaugeInterval === 0) {
                    this.gauge = Math.min(this.maxGauge, this.gauge + 1);
                }

                // 상대를 바라보도록 방향 자동 정렬 (공격/피격 중 제외)
                if (this.canAct() && opponent && opponent.state !== 'KO') {
                    this.facing = opponent.x >= this.x ? 1 : -1;
                }

                // 물리 이동 적용
                this.x += this.vx;
                this.y += this.vy;

                if (!this.isGrounded) {
                    this.vy += 0.72; // 중력
                } else {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    if (this.state === 'JUMP') this.state = 'IDLE';
                }

                this.vx *= 0.82;
                // 상태별 프레임 및 타격 판정 (강태풍/왕무영은 리치 특성 반영)
                const reachBonus = this.spec.id === 'viper' ? 35 : (this.spec.id === 'taepung' ? 25 : 0);
                if (this.state === 'PUNCH') {
                    if (this.stateTime === 6 && !this.attackHitApplied) {
                        this.checkAttackHit(opponent, 108 + reachBonus, this.spec.punchDmg, 6, false);
                    }
                    if (this.stateTime >= 16) this.state = 'IDLE';
                } else if (this.state === 'KICK') {
                    if (this.stateTime === 8 && !this.attackHitApplied) {
                        const kickBonusDmg = this.spec.id === 'taepung' ? Math.round(this.spec.kickDmg * 1.2) : this.spec.kickDmg;
                        this.checkAttackHit(opponent, 128 + reachBonus, kickBonusDmg, 9, false);
                    }
                    if (this.stateTime >= 22) this.state = 'IDLE';
                } else if (this.state === 'SPECIAL') {
                    if (this.stateTime < 14) {
                        this.vx = this.facing * 14;
                    }
                    if (this.stateTime === 12 && !this.attackHitApplied) {
                        this.checkAttackHit(opponent, 210, this.spec.specialDmg, 18, true);
                    }
                    if (this.stateTime >= 32) this.state = 'IDLE';
                } else if (this.state === 'HURT') {
                    if (this.stateTime >= 16) this.state = 'IDLE';
                }
            }

            checkAttackHit(opponent, reach, dmg, knockback, isSpecial) {
                const dist = Math.abs(this.x - opponent.x);
                const dirMatch = (opponent.x - this.x) * this.facing >= -20;
                const heightMatch = Math.abs(this.y - opponent.y) < 85;

                if (dist <= reach && dirMatch && heightMatch) {
                    this.attackHitApplied = true;

                    // [단독 특성 기반 흑섬(黑閃) 발동 확률 계산]
                    let finalDmg = this.spec.id === 'dark_yejun' ? Math.round(dmg * 1.25) : dmg;
                    // [추가 특성: 강태풍 선풍 반격] 가드 직후 반격 시 공격력 +25%
                    if (this.spec.id === 'taepung' && this.guardCounterTimer > 0) {
                        finalDmg = Math.round(finalDmg * 1.25);
                    }
                    // [추가 특성: 반달왕 맹수의 포효] 체력 50% 이하 시 공격력 +15%
                    if (this.spec.id === 'bear' && (this.hp / this.maxHp) <= 0.50) {
                        finalDmg = Math.round(finalDmg * 1.15);
                    }
                    // [추가 특성: 왕무영 뱀의 비늘] 중독된 상대에게 피해 +18%
                    if (this.spec.id === 'viper' && opponent.poisonTimer > 0) {
                        finalDmg = Math.round(finalDmg * 1.18);
                    }

                    let isBlackFlash = false;

                    // 1) 오예준: 기본 반격 흑섬 18%, 피가 40% 이하가 되면 가드 반격 흑섬 확률 38%로 대폭 상승!
                    // 2) 흑화한 오예준: 심연의 폭주 특성으로 상시 25% 확률로 흑섬 발동!
                    // 3) 그 외 캐릭터: 가드 반격 시 10% 확률로 흑섬 발동
                    let bfChance = 0;
                    if (!isSpecial) {
                        if (this.spec.id === 'dark_yejun') {
                            bfChance = 0.25;
                        } else if (this.guardCounterTimer > 0) {
                            if (this.spec.id === 'yejun') {
                                bfChance = (this.hp / this.maxHp) <= 0.40 ? 0.38 : 0.18;
                            } else {
                                bfChance = 0.10;
                            }
                        }
                    }

                    if (bfChance > 0 && Math.random() < bfChance) {
                        isBlackFlash = true;
                        finalDmg = Math.round(finalDmg * 2.8); // 기본 100% + 180% 추가 = 280% 데미지
                        this.guardCounterTimer = 0;
                    }

                    const hitSuccess = opponent.takeDamage(
                        finalDmg,
                        this.facing * (isBlackFlash ? knockback * 1.8 : knockback),
                        isSpecial
                    );

                    if (hitSuccess) {
                        this.comboCount++;
                        this.comboTimer = 90;
                        this.gauge = Math.min(this.maxGauge, this.gauge + (isSpecial ? 0 : (isBlackFlash ? 35 : 16)));

                        // [단독 특성: 독사권 왕무영] 명중 시 3초간 맹독 부여
                        if (this.spec.id === 'viper') {
                            opponent.poisonTimer = 180;
                        }
                        // [단독 특성: 불닭왕 떡볶이] 명중 시 3초간 캡사이신 화상 부여 & 불꽃 임팩트
                        if (this.spec.id === 'tteokbokki') {
                            opponent.burnTimer = 180;
                            spawnFireParticles(opponent.x, opponent.y - 85, 14);
                        }
                        // [단독 특성: 여자 흑인 파이터 '자라' - 썬더 카운터] 주먹 적중 시 30% 확률 감전 스턴 (중복 무한 스턴 방지)
                        if (this.spec.id === 'zara' && this.state === 'PUNCH' && opponent.charmTimer <= 0 && Math.random() < 0.30) {
                            opponent.charmTimer = 36;
                            opponent.ccType = 'SHOCK';
                            spawnParticles(opponent.x, opponent.y - 105, '#fbbf24', 14);
                            addFloatingText(opponent.x, opponent.y - 165, '⚡ 썬더 감전 스턴!', '#fde047');
                        }
                        // [단독 특성: 양귀비 - 매혹 & 천년화 기운 흡수] (중복 무한 매혹 방지)
                        if (this.spec.id === 'gwibi') {
                            opponent.gauge = Math.max(0, opponent.gauge - 12);
                            this.gauge = Math.min(this.maxGauge, this.gauge + 12);
                            this.hp = Math.min(this.maxHp, this.hp + 25);
                            if (opponent.charmTimer <= 0 && Math.random() < 0.25) {
                                opponent.charmTimer = 55;
                                opponent.ccType = 'CHARM';
                                spawnParticles(opponent.x, opponent.y - 105, '#f43f5e', 16);
                                addFloatingText(opponent.x, opponent.y - 170, '💖 양귀비의 매혹! (행동 불능)', '#fb7185');
                            }
                        }

                        if (isBlackFlash) {
                            sfx.playBlackFlash();
                            screenShake = 24;
                            hitStopFrames = 12;
                            triggerBlackFlashEffect(opponent.x, opponent.y - 85);
                            // [상향 특성: 오예준 흑섬 적중 시 근성 체력 +45 회복]
                            if (this.spec.id === 'yejun') {
                                this.hp = Math.min(this.maxHp, this.hp + 45);
                                addFloatingText(this.x, this.y - 165, '💚 거북목 투지 회복 +45!', '#4ade80');
                            }
                            const awakeTag = (this.spec.id === 'yejun' && (this.hp / this.maxHp) <= 0.40) ? ' [각성 38%]' : '';
                            addFloatingText(opponent.x, opponent.y - 185, `⚡ ${this.spec.name} 흑섬(黑閃)!!${awakeTag} ⚡`, '#ef4444');
                        }
                    }
                }
            }
        }

                btnHome.classList.add('hidden');
                btnSkip.classList.add('hidden');

                btnHome.classList.remove('hidden');
                if (gameState === 'STORY') btnSkip.classList.remove('hidden');

                if (gameMode === 'PVP') {

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * 7;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd - 2,
                    size: 4 + Math.random() * 5,
                    color: color,
                    life: 22 + Math.floor(Math.random() * 12)
                });
            }
        }

        // 불닭왕 떡볶이 전용 위로 타오르는 화상 불꽃 파티클
        function spawnFireParticles(x, y, count) {
            const fireColors = ['#ef4444', '#f97316', '#facc15', '#fef08a'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 44,
                    y: y + (Math.random() - 0.5) * 36,
                    vx: (Math.random() - 0.5) * 2.2,
                    vy: -(2.5 + Math.random() * 4.5),
                    size: 5 + Math.random() * 6,
                    color: fireColors[Math.floor(Math.random() * fireColors.length)],
                    isFire: true,
                    life: 20 + Math.floor(Math.random() * 12)
                });
            }
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 40
            });
        }

        function triggerBlackFlashEffect(x, y) {
            for (let i = 0; i < 36; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 4 + Math.random() * 11;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    size: 5 + Math.random() * 7,
                    color: i % 2 === 0 ? '#09090b' : '#dc2626',
                    life: 24 + Math.floor(Math.random() * 14)
                });
            }
            for (let b = 0; b < 14; b++) {
                const baseAng = (b / 14) * Math.PI * 2 + Math.random() * 0.3;
                const pts = [{ x: x, y: y }];
                let cx = x;
                let cy = y;
                for (let seg = 1; seg <= 4; seg++) {
                    const jitter = (Math.random() - 0.5) * 0.9;
                    const len = 24 + Math.random() * 26;
                    cx += Math.cos(baseAng + jitter) * len;
                    cy += Math.sin(baseAng + jitter) * len;
                    pts.push({ x: cx, y: cy });
                }
                blackFlashBolts.push({
                    pts: pts,
                    life: 22,
                    maxLife: 22
                });
            }
        }

        function handlePlayerControl() {
            if (!player || player.state === 'KO') return;

            if (gameMode === 'PVP') {
                // 2인용 모드: 1P는 WASD 이동 + C(가드)
                const left = keys['KeyA'];
                const right = keys['KeyD'];
                const up = keys['KeyW'];
                const down = keys['KeyS'];
                const block = keys['KeyC'];

                if (player.canAct()) {
                    if (block) player.state = 'BLOCK';
                    else if (down) player.state = 'CROUCH';
                    else if (left) { player.vx = -player.spec.speed; player.state = 'WALK'; }
                    else if (right) { player.vx = player.spec.speed; player.state = 'WALK'; }
                    else player.state = 'IDLE';

                    if (up && player.isGrounded && !block) {
                        player.vy = -15.5;
                        player.state = 'JUMP';
                    }
                }
                return;
            }

            // 1인용 모드 (스토리 / FREE): A/D 또는 좌/우 방향키, Space 가드
            const left = keys['ArrowLeft'] || keys['KeyA'];
            const right = keys['ArrowRight'] || keys['KeyD'];
            const up = keys['ArrowUp'] || keys['KeyW'];
            const down = keys['ArrowDown'] || keys['KeyS'];
            const block = keys['Space'];

            if (player.canAct()) {
                if (block) {
                    player.state = 'BLOCK';
                } else if (down) {
                    player.state = 'CROUCH';
                } else if (left) {
                    player.vx = -player.spec.speed;
                    player.state = 'WALK';
                } else if (right) {
                    player.vx = player.spec.speed;
                    player.state = 'WALK';
                } else {
                    player.state = 'IDLE';
                }

                if (up && player.isGrounded && !block) {
                    player.vy = -15.5;
                    player.state = 'JUMP';
                }
            }
        }

        function handlePlayer2Control() {
            if (!enemy || enemy.state === 'KO') return;

            // 2인용 모드: 2P는 방향키(←↑↓→) 이동 + , 또는 Numpad3(가드)
            const left = keys['ArrowLeft'];
            const right = keys['ArrowRight'];
            const up = keys['ArrowUp'];
            const down = keys['ArrowDown'];
            const block = keys['Comma'] || keys['Numpad3'];

            if (enemy.canAct()) {
                if (block) enemy.state = 'BLOCK';
                else if (down) enemy.state = 'CROUCH';
                else if (left) { enemy.vx = -enemy.spec.speed; enemy.state = 'WALK'; }
                else if (right) { enemy.vx = enemy.spec.speed; enemy.state = 'WALK'; }
                else enemy.state = 'IDLE';

                if (up && enemy.isGrounded && !block) {
                    enemy.vy = -15.5;
                    enemy.state = 'JUMP';
                }
            }
        }

        function handleEnemyAI() {
            if (gameMode === 'PVP') {
                handlePlayer2Control();
                return;
            }
            if (!enemy || !player || enemy.state === 'KO' || player.state === 'KO') return;
            if (!enemy.canAct()) return;

            const dist = Math.abs(enemy.x - player.x);
            const aggr = enemy.spec.aiAggression || 0.55;

            if (enemy.gauge >= enemy.maxGauge && dist < 240 && Math.random() < 0.08) {
                enemy.startAttack('SPECIAL');
                return;
            }

            // 가드 반격 찬스가 활성화되면 AI도 즉시 반격(흑섬 노림) 시도!
            if (enemy.guardCounterTimer > 0 && dist <= 130 && Math.random() < 0.35) {
                enemy.startAttack(Math.random() < 0.5 ? 'PUNCH' : 'KICK');
                return;
            }

            if (dist > 115) {
                if (Math.random() < aggr) {
                    enemy.vx = enemy.facing * enemy.spec.speed * 0.92;
                    enemy.state = 'WALK';
                } else {
                    enemy.state = 'IDLE';
                }
            } else {
                const r = Math.random();
                if ((player.state === 'PUNCH' || player.state === 'KICK') && r < 0.32) {
                    enemy.state = 'BLOCK';
                } else if (r < 0.055 * (aggr + 0.5)) {
                    enemy.startAttack(Math.random() < 0.5 ? 'PUNCH' : 'KICK');
                } else if (r < 0.09) {
                    enemy.vx = -enemy.facing * enemy.spec.speed;
                    enemy.state = 'WALK';
                } else {
                    enemy.state = 'IDLE';
                }
            }
        }

        // 6. 고퀄리티 애니메이션 캐릭터 초상화 & 작화 렌더링

        function drawAnimePortrait(id, cx, cy, scale = 1, flipX = false) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(flipX ? -scale : scale, scale);

            if (id === 'gwibi') {
                // ★ 극상 미소녀 '양귀비' 애니메이션 작화 ★
                const halo = ctx.createRadialGradient(0, -10, 15, 0, -10, 125);
                halo.addColorStop(0, 'rgba(255, 228, 230, 0.65)');
                halo.addColorStop(0.6, 'rgba(244, 63, 94, 0.22)');
                halo.addColorStop(1, 'rgba(244, 63, 94, 0)');
                ctx.fillStyle = halo;
                ctx.beginPath();
                ctx.arc(0, -10, 125, 0, Math.PI * 2);
                ctx.fill();

                const hairGrad = ctx.createLinearGradient(0, -115, 0, 145);
                hairGrad.addColorStop(0, '#09090b');
                hairGrad.addColorStop(0.45, '#1e1b4b');
                hairGrad.addColorStop(0.85, '#4c0519');
                hairGrad.addColorStop(1, '#881337');
                ctx.fillStyle = hairGrad;

                ctx.beginPath();
                ctx.moveTo(-78, -42);
                ctx.bezierCurveTo(-122, 18, -112, 112, -90, 148);
                ctx.lineTo(90, 148);
                ctx.bezierCurveTo(112, 112, 122, 18, 78, -42);
                ctx.arc(0, -42, 78, 0, Math.PI, true);
                ctx.fill();

                ctx.fillStyle = '#fff1e6';
                ctx.beginPath();
                ctx.moveTo(-21, 42);
                ctx.lineTo(21, 42);
                ctx.lineTo(32, 95);
                ctx.lineTo(-32, 95);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(225, 29, 72, 0.16)';
                ctx.beginPath();
                ctx.ellipse(0, 52, 20, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                const dressGrad = ctx.createLinearGradient(0, 75, 0, 150);
                dressGrad.addColorStop(0, '#e11d48');
                dressGrad.addColorStop(0.5, '#be123c');
                dressGrad.addColorStop(1, '#881337');
                ctx.fillStyle = dressGrad;
                ctx.beginPath();
                ctx.moveTo(-78, 148);
                ctx.quadraticCurveTo(-56, 82, -24, 78);
                ctx.lineTo(24, 78);
                ctx.quadraticCurveTo(56, 82, 78, 148);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(0, 88, 5, 0, Math.PI * 2);
                ctx.fill();

                const faceGrad = ctx.createRadialGradient(-8, -12, 8, 0, 0, 74);
                faceGrad.addColorStop(0, '#ffffff');
                faceGrad.addColorStop(0.55, '#fff1e6');
                faceGrad.addColorStop(0.9, '#ffe4d6');
                faceGrad.addColorStop(1, '#fecdd3');
                ctx.fillStyle = faceGrad;
                ctx.beginPath();
                ctx.moveTo(-53, -25);
                ctx.bezierCurveTo(-55, 24, -23, 52, 0, 55);
                ctx.bezierCurveTo(23, 52, 55, 24, 53, -25);
                ctx.arc(0, -25, 53, 0, Math.PI, true);
                ctx.fill();

                [-29, 29].forEach(bx => {
                    const blush = ctx.createRadialGradient(bx, 13, 2, bx, 13, 19);
                    blush.addColorStop(0, 'rgba(244, 63, 94, 0.48)');
                    blush.addColorStop(1, 'rgba(244, 63, 94, 0)');
                    ctx.fillStyle = blush;
                    ctx.beginPath();
                    ctx.arc(bx, 13, 19, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                    ctx.beginPath();
                    ctx.ellipse(bx + (bx < 0 ? -4 : 4), 10, 3.5, 1.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                });

                [-24, 24].forEach((ex, idx) => {
                    const dir = idx === 0 ? -1 : 1;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(ex, -2, 16, 12, dir * -0.08, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(76, 5, 25, 0.18)';
                    ctx.beginPath();
                    ctx.ellipse(ex, -6, 15, 6, dir * -0.08, 0, Math.PI * 2);
                    ctx.fill();

                    const irisGrad = ctx.createLinearGradient(ex, -13, ex, 11);
                    irisGrad.addColorStop(0, '#4c0519');
                    irisGrad.addColorStop(0.45, '#e11d48');
                    irisGrad.addColorStop(0.8, '#f43f5e');
                    irisGrad.addColorStop(1, '#fda4af');
                    ctx.fillStyle = irisGrad;
                    ctx.beginPath();
                    ctx.ellipse(ex, -1, 10, 11.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#1e1b4b';
                    ctx.beginPath();
                    ctx.arc(ex, -1, 4.6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex - 4, -5.5, 3.6, 0, Math.PI * 2);
                    ctx.arc(ex + 4, 3.5, 2.0, 0, Math.PI * 2);
                    ctx.arc(ex - 1, 5.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#09090b';
                    ctx.lineWidth = 3.6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ex - 16 * dir, -5);
                    ctx.quadraticCurveTo(ex, -17, ex + 19 * dir, -6);
                    ctx.stroke();

                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(ex + 14 * dir, -8);
                    ctx.lineTo(ex + 20 * dir, -12);
                    ctx.moveTo(ex + 8 * dir, -11);

        // 스테이지 배경 렌더링
        function drawArenaBackground(theme) {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            if (theme === 'outback') {
                skyGrad.addColorStop(0, '#7c2d12');
                skyGrad.addColorStop(1, '#f59e0b');
            } else if (theme === 'dojo') {
                skyGrad.addColorStop(0, '#1e293b');
                skyGrad.addColorStop(1, '#334155');
            } else if (theme === 'snow') {
                skyGrad.addColorStop(0, '#0c4a6e');
                skyGrad.addColorStop(1, '#bae6fd');
            } else if (theme === 'bamboo') {
                skyGrad.addColorStop(0, '#064e3b');
                skyGrad.addColorStop(1, '#10b981');
            } else if (theme === 'cage') {
                skyGrad.addColorStop(0, '#09090b');
                skyGrad.addColorStop(1, '#27272a');
            } else if (theme === 'temple') {
                skyGrad.addColorStop(0, '#78350f');
                skyGrad.addColorStop(1, '#d97706');
            } else if (theme === 'palace') {
                skyGrad.addColorStop(0, '#4c0519');
                skyGrad.addColorStop(1, '#9f1239');
            } else if (theme === 'street') {
                skyGrad.addColorStop(0, '#0f172a');
                skyGrad.addColorStop(1, '#0369a1');
            } else if (theme === 'kitchen') {
                skyGrad.addColorStop(0, '#450a0a');
                skyGrad.addColorStop(1, '#dc2626');
            } else if (theme === 'rooftop') {
                skyGrad.addColorStop(0, '#1e1b4b');
                skyGrad.addColorStop(1, '#d97706');
            } else {
                skyGrad.addColorStop(0, '#1e1b4b');
                skyGrad.addColorStop(1, '#581c87');
            }
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // 배경 장식 요소
            if (theme === 'palace') {
                ctx.fillStyle = '#fecdd3';
                ctx.beginPath();
                ctx.arc(W / 2, 160, 75, 0, Math.PI * 2);
                ctx.fill();
            } else if (theme === 'bamboo') {
                ctx.fillStyle = 'rgba(6, 78, 59, 0.45)';
                for (let x = 70; x < W; x += 110) {
                    ctx.fillRect(x, 0, 18, GROUND_Y);
                }
            } else if (theme === 'cage') {
                ctx.strokeStyle = 'rgba(161, 161, 170, 0.25)';
                ctx.lineWidth = 2;
                for (let x = 40; x < W; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(x, 80);
                    ctx.lineTo(x, GROUND_Y);
                    ctx.stroke();
                }
            }

            // 바닥 매트
            ctx.fillStyle = theme === 'snow' ? '#e0f2fe' : '#18181b';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();
        }

        // 상단 HUD (체력바, 기 게이지, 타이머) 렌더링
        function drawHUD() {
            const barW = 360;
            const barH = 26;

            // P1 체력바
            ctx.fillStyle = '#18181b';
            ctx.fillRect(35, 24, barW, barH);
            const p1Ratio = Math.max(0, player.hp / player.maxHp);
            ctx.fillStyle = p1Ratio > 0.3 ? '#3b82f6' : '#ef4444';
            ctx.fillRect(35 + barW * (1 - p1Ratio), 24, barW * p1Ratio, barH);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2;
            ctx.strokeRect(35, 24, barW, barH);

            // P2 체력바
            ctx.fillStyle = '#18181b';
            ctx.fillRect(W - 35 - barW, 24, barW, barH);
            const p2Ratio = Math.max(0, enemy.hp / enemy.maxHp);
            ctx.fillStyle = p2Ratio > 0.3 ? enemy.spec.themeColor : '#ef4444';
            ctx.fillRect(W - 35 - barW, 24, barW * p2Ratio, barH);
            ctx.strokeStyle = '#fde047';
            ctx.strokeRect(W - 35 - barW, 24, barW, barH);

            // 타이머
            ctx.fillStyle = '#09090b';
            ctx.beginPath();
            ctx.roundRect(W / 2 - 36, 16, 72, 46, 10);
            ctx.fill();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#fde047';
            ctx.font = '900 30px "Black Han Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(String(roundTimer).padStart(2, '0'), W / 2, 50);

            // 이름 및 스테이지 표시
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 16px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`P1 ${player.spec.name} (${player.hp}/${player.maxHp})`, 38, 70);

            ctx.textAlign = 'right';
            const rightLabel = gameMode === 'STORY'
                ? `STAGE ${STAGES[currentStageIdx].stageNum} : ${enemy.spec.name} (${enemy.hp})`
                : `${gameMode === 'PVP' ? 'P2' : 'CPU'} ${enemy.spec.name} (${enemy.hp}/${enemy.maxHp})`;
            ctx.fillText(rightLabel, W - 38, 70);

            // 하단 기 게이지바 (P1)
            const gW = 240;
            const gH = 12;
            ctx.fillStyle = '#18181b';
            ctx.fillRect(35, H - 24, gW, gH);
            ctx.fillStyle = player.gauge >= 100 ? '#e879f9' : '#a855f7';
            ctx.fillRect(35, H - 24, gW * (player.gauge / 100), gH);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(35, H - 24, gW, gH);

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 11px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'left';
            const isYejunAwake = player && player.spec.id === 'yejun' && (player.hp / player.maxHp) <= 0.40;
            const traitStatus = isYejunAwake ? '🔥 [각성: 흑섬 38% & 피해 15% 경감!]' : `[특성: ${player.spec.traitName}]`;
            const p1SpecialKey = gameMode === 'PVP' ? 'V' : 'L / C';
            ctx.fillText(`${player.gauge >= 100 ? `🔥 필살기 READY! (${p1SpecialKey})` : `P1 기 ${Math.floor(player.gauge)}%`}  ${traitStatus}`, 35, H - 29);

            // P2 기 게이지바 (우측 하단)
            ctx.fillStyle = '#18181b';
            ctx.fillRect(W - 35 - gW, H - 24, gW, gH);
            ctx.fillStyle = enemy.gauge >= 100 ? '#e879f9' : '#f43f5e';
            ctx.fillRect(W - 35 - gW + gW * (1 - enemy.gauge / 100), H - 24, gW * (enemy.gauge / 100), gH);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(W - 35 - gW, H - 24, gW, gH);

            ctx.textAlign = 'right';
            const p2Prefix = gameMode === 'PVP' ? 'P2' : 'CPU';
            const p2ReadyText = gameMode === 'PVP' ? '🔥 필살기 READY! (. / Num0)' : '🔥 필살기 FULL!';
            ctx.fillText(`${enemy.gauge >= 100 ? p2ReadyText : `${p2Prefix} 기 ${Math.floor(enemy.gauge)}%`} [${enemy.spec.traitName}]`, W - 35, H - 29);

            const specialBtn = document.getElementById('btn-special-pad');
            if (specialBtn) {
                if (player.gauge >= 100) specialBtn.classList.add('special-ready');
                else specialBtn.classList.remove('special-ready');
            }
        }

                ctx.fillText('조작: WASD | Z·X·C·V', 135, 412);
            }

            // 우측: 2P / CPU 프리뷰 카드
            const p2 = ALL_FIGHTERS[p2SelectedIdx];
            ctx.fillStyle = 'rgba(136, 19, 55, 0.35)';

            ctx.roundRect(W - 250, 72, 230, 355, 14);

            ctx.strokeStyle = selectTurn === 2 ? '#fde047' : '#f43f5e';
            ctx.lineWidth = selectTurn === 2 ? 3.5 : 2;
            ctx.stroke();

            drawAnimePortrait(p2.id, W - 135, 175, 0.78, true);
            ctx.fillStyle = '#fb7185';
            ctx.font = '900 18px "Noto Sans KR", sans-serif';
            ctx.fillText(`${isPvp ? '2P' : 'CPU'} : ${p2.name}`, W - 135, 285);
            ctx.fillStyle = '#e4e4e7';
            ctx.font = '700 12px "Noto Sans KR", sans-serif';
            ctx.fillText(`HP ${p2.maxHp} | 주먹 ${p2.punchDmg} | 발 ${p2.kickDmg}`, W - 135, 307);

            ctx.font = '700 11px "Noto Sans KR", sans-serif';
            ctx.fillText(`★ ${p2.traitName}`, W - 135, 329);

            ctx.font = '400 10px "Noto Sans KR", sans-serif';

            ctx.font = '700 11px "Noto Sans KR", sans-serif';
            ctx.fillText(`필살: ${p2.specialName}`, W - 135, 388);
            if (isPvp) {
                ctx.fillStyle = '#fda4af';
                ctx.font = '700 10px "Noto Sans KR", sans-serif';
                ctx.fillText('조작: 방향키 | N·M·,·.', W - 135, 412);
            }

            // 중앙: 12명 캐릭터 로스터 그리드 (4열 x 3행)
            const gridStartX = 268;
            const gridStartY = 74;
            const cellW = 102;
            const cellH = 112;
            const gap = 6;

            ALL_FIGHTERS.forEach((f, idx) => {
                const col = idx % 4;
                const row = Math.floor(idx / 4);
                const cx = gridStartX + col * (cellW + gap);
                const cy = gridStartY + row * (cellH + gap);

                const isP1 = idx === p1SelectedIdx;
                const isP2 = idx === p2SelectedIdx;

                ctx.fillStyle = isP1 ? 'rgba(37, 99, 235, 0.45)' : (isP2 ? 'rgba(225, 29, 72, 0.45)' : '#18181b');
                ctx.beginPath();
                ctx.roundRect(cx, cy, cellW, cellH, 10);
                ctx.fill();

                ctx.strokeStyle = isP1 && isP2 ? '#fde047' : (isP1 ? '#60a5fa' : (isP2 ? '#fb7185' : '#3f3f46'));

                drawAnimePortrait(f.id, cx + cellW / 2, cy + 44, 0.34, false);

                ctx.fillStyle = '#ffffff';
                ctx.font = '700 10px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                const shortName = f.name.split(' (')[0];
                ctx.fillText(shortName, cx + cellW / 2, cy + 96);

                if (isP1 || isP2) {
                    ctx.fillStyle = isP1 ? '#3b82f6' : '#e11d48';
                    ctx.fillRect(cx + 6, cy + 6, 26, 15);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 9px "Noto Sans KR", sans-serif';
                    ctx.fillText(isP1 && isP2 ? '1P/2P' : (isP1 ? '1P' : (isPvp ? '2P' : 'CPU')), cx + 19, cy + 17);

            // 하단 스테이지 배경 선택 바 & 대전 시작 버튼
            const arenaName = STAGES[selectedArenaIdx].arenaName;
            ctx.fillStyle = '#27272a';
            ctx.beginPath();
            ctx.roundRect(120, 448, 360, 48, 12);
            ctx.fill();
            ctx.strokeStyle = '#71717a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#e4e4e7';
            ctx.font = '700 14px "Noto Sans KR", sans-serif';
            ctx.fillText(`🏟️ 배경: ${arenaName} (클릭해 변경)`, 300, 477);

            // 대전 시작 버튼
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.roundRect(510, 444, 330, 56, 14);
            ctx.fill();
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 22px "Black Han Sans", sans-serif';
            ctx.fillText('🔥 대결 시작! (FIGHT)', 675, 480);
        }

        // 고퀄리티 오프닝 스토리 애니메이션 (총 4장면 시네마틱 연출)

                        '수업이 끝난 오후 5시, 묵직한 가방을 메고 거북목으로 터벅터벅 걷던 평범한 고등학생 오예준.',

                {

                    bg: ['#09090b', '#312e81', '#4c1d95'],
                    chapter: 'ACT 3. 붉은 초롱불이 이끄는 비밀 계단',
                    speaker: '내레이션',
                    lines: [
                        '꽃향기에 홀린 듯 양귀비의 발걸음을 따라간 곳은 도심 한복판에 숨겨진 고대 지하 무술 투기장!',
                        '거대한 철창 문이 굉음과 함께 닫히고, 사방에서 함성과 스포트라이트가 예준을 비춘다.'
                    ]

                {
                    sceneType: 'ARENA_DECLARATION',
                    bg: ['#18181b', '#7f1d1d', '#b91c1c'],
                    chapter: 'ACT 4. 강제 참전! 우승만이 살 길이다',
                    speaker: '오예준',
                    lines: [
                        '"여기까지 따라온 대가는 링 위에서 치러야 해요. 최후의 승자가 되면... 소원을 들어줄게요."',
                        '양귀비의 도발에 16년간 굽어있던 예준의 거북목이 전율하며 각성하기 시작했다!'
                    ]
                }
            ];

            const slide = slides[storySlideIdx] || slides[0];
            const t = stateTimer;

            // 시네마틱 다층 그라데이션 배경
            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, slide.bg[0]);
            bgGrad.addColorStop(0.55, slide.bg[1]);
            bgGrad.addColorStop(1, slide.bg[2]);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // 장면별 맞춤형 애니메이션 아트워크
            if (slide.sceneType === 'SUNSET_ENCOUNTER') {
                // 노을 태양 & 빛줄기
                const sunGrad = ctx.createRadialGradient(W * 0.68, 170, 15, W * 0.68, 170, 190);
                sunGrad.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
                sunGrad.addColorStop(0.4, 'rgba(251, 113, 133, 0.45)');
                sunGrad.addColorStop(1, 'rgba(251, 113, 133, 0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(W * 0.68, 170, 190, 0, Math.PI * 2);
                ctx.fill();

                // 좌측 예준 & 우측 뒤돌아보는 양귀비 투샷 연출
                const yejunSlide = Math.min(230, 140 + t * 1.5);
                const gwibiFloat = Math.sin(t * 0.05) * 6;
                drawAnimePortrait('yejun', yejunSlide, 245, 1.05, false);
                drawAnimePortrait('gwibi', W - 260, 215 + gwibiFloat, 1.32, true);
            } else if (slide.sceneType === 'GWIBI_CLOSEUP') {
                // 극상 클로즈업 + 회전하는 후광 링 + 반짝임
                ctx.save();
                ctx.translate(W / 2, 195);
                ctx.rotate(t * 0.01);
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([12, 10]);
                ctx.beginPath();
                ctx.arc(0, 0, 165, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                const zoomScale = Math.min(1.62, 1.38 + t * 0.002);
                drawAnimePortrait('gwibi', W / 2, 205, zoomScale, false);
            } else if (slide.sceneType === 'MYSTERIOUS_TEMPLE') {
                // 지하 계단 원근감 & 붉은 초롱불 + 철창 내려오는 애니메이션
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                for (let s = 0; s < 6; s++) {
                    const stepW = 320 + s * 95;
                    ctx.fillRect(W / 2 - stepW / 2, 120 + s * 42, stepW, 38);
                }
                // 철창 셔터 하강 애니메이션
                const cageDrop = Math.min(340, t * 8);
                ctx.strokeStyle = '#71717a';
                ctx.lineWidth = 6;
                for (let bx = 140; bx <= W - 140; bx += 68) {
                    ctx.beginPath();
                    ctx.moveTo(bx, 0);
                    ctx.lineTo(bx, cageDrop);
                    ctx.stroke();
                }
                drawAnimePortrait('yejun', W / 2, 230, 1.25, false);
            } else {
                // 대결 선포 투샷 + 불꽃 오라
                const shakeX = t < 25 ? (Math.random() - 0.5) * 6 : 0;
                drawAnimePortrait('yejun', 250 + shakeX, 225, 1.25, false);
                drawAnimePortrait('gwibi', W - 250, 225, 1.25, true);

                ctx.fillStyle = '#fde047';
                ctx.font = '900 34px "Black Han Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ TOURNAMENT START ⚡', W / 2, 165);
            }

            // 꽃잎 & 빛입자 파티클
            for (let i = 0; i < 24; i++) {
                const px = ((t * 2.2 + i * 73) % (W + 40)) - 20;
                const py = ((t * 1.4 + i * 47) % (H - 150));
                ctx.fillStyle = i % 3 === 0 ? 'rgba(253, 224, 71, 0.7)' : 'rgba(253, 164, 175, 0.75)';
                ctx.beginPath();
                ctx.ellipse(px, py, 7, 3.8, (t + i) * 0.05, 0, Math.PI * 2);
                ctx.fill();
            }

            // 영화 레터박스 상단 바
            ctx.fillStyle = '#09090b';
            ctx.fillRect(0, 0, W, 36);
            ctx.fillStyle = '#fda4af';
            ctx.font = '900 14px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`🌸 OPENING STORY  |  ${slide.chapter}`, 28, 23);

            // 하단 시네마틱 자막 박스
            ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
            ctx.beginPath();
            ctx.roundRect(50, 358, W - 100, 156, 16);
            ctx.fill();
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // 화자 이름 배지
            ctx.fillStyle = '#e11d48';
            ctx.beginPath();
            ctx.roundRect(75, 343, 240, 30, 8);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 14px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(slide.speaker, 195, 363);

            // 타자기(Typewriter) 대사 애니메이션 효과
            const visibleChars = Math.floor(t * 1.8);
            ctx.textAlign = 'left';
            ctx.fillStyle = '#f4f4f5';
            ctx.font = '700 17px "Noto Sans KR", sans-serif';
            let charBudget = visibleChars;
            slide.lines.forEach((line, i) => {
                const shown = line.slice(0, Math.max(0, charBudget));
                charBudget -= line.length;
                ctx.fillText(shown, 78, 405 + i * 32);
            });

            ctx.textAlign = 'right';
            ctx.fillStyle = '#fde047';
            ctx.font = '700 14px "Noto Sans KR", sans-serif';
            ctx.fillText(`클릭 / ENTER 다음 장면 (${storySlideIdx + 1}/${slides.length}) ▶`, W - 75, 496);
        }

        // 최종 우승 엔딩 애니메이션 (총 3장면 시네마틱 피날레)
        function drawEndingAnimation() {
