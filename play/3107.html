<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>똥피하기 아케이드 - Poop Dodge</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 게임 전용 커스텀 스타일 및 애니메이션 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .font-game {
            font-family: 'Jua', sans-serif;
        }

        /* 게임 컨테이너 반응형 설정 */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            max-height: 820px;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            #game-wrapper {
                height: 92dvh;
                border-radius: 28px;
                border: 6px solid #475569;
            }
        }

        /* 캔버스 스타일 */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 75%, #fef9c3 100%);
        }

        /* 버튼 입체감 및 애니메이션 */
        .btn-arcade {
            font-family: 'Jua', sans-serif;
            transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 6px 0 #b45309;
        }
        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b45309;
        }

        .btn-control {
            transition: transform 0.08s ease, background-color 0.1s ease;
            box-shadow: 0 4px 0 rgba(15, 23, 42, 0.25);
        }
        .btn-control:active, .btn-control.active {
            transform: translateY(3px) scale(0.96);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.25);
            background-color: #cbd5e1;
        }

        /* 부유 애니메이션 */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float {
            animation: float 2.4s ease-in-out infinite;
        }

        /* 반짝임 배지 */
        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-fast {
            animation: pulse-scale 1s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- 메인 게임 컨테이너 -->
    <div id="game-wrapper">
        
        <!-- 상단 HUD (게임 중 및 대기 중 공통 표시) -->
        <header id="hud" class="absolute top-0 left-0 right-0 z-20 p-3 sm:p-4 flex items-center justify-between pointer-events-none">
            <!-- 점수 & 최고기록 -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <div class="bg-white/90 backdrop-blur-sm border-2 border-slate-700 rounded-2xl px-3 py-1.5 shadow-sm">
                    <div class="text-[10px] font-bold text-slate-500 leading-none">현재 점수</div>
                    <div id="scoreDisplay" class="font-game text-xl sm:text-2xl text-slate-800 leading-tight">0</div>
                </div>
                <div class="bg-amber-100/90 backdrop-blur-sm border-2 border-amber-500 rounded-2xl px-3 py-1.5 shadow-sm">
                    <div class="text-[10px] font-bold text-amber-700 leading-none">👑 최고 기록</div>
                    <div id="highScoreDisplay" class="font-game text-xl sm:text-2xl text-amber-800 leading-tight">0</div>
                </div>
            </div>

            <!-- 레벨, 상태 아이콘 & 음소거 버튼 -->
            <div class="flex items-center gap-1.5 pointer-events-auto">
                <!-- 상태 버프 표시 영역 -->
                <div id="buffIndicators" class="flex items-center gap-1">
                    <span id="shieldBadge" class="hidden bg-sky-500 text-white text-xs font-bold px-2 py-1 rounded-xl border-2 border-sky-700 shadow-sm" title="방어막 활성화">🛡️</span>
                    <span id="speedBadge" class="hidden bg-emerald-500 text-white text-xs font-bold px-2 py-1 rounded-xl border-2 border-emerald-700 shadow-sm" title="스피드 업!">👟</span>
                </div>

                <!-- 레벨 표시 -->
                <div class="bg-indigo-600 text-white border-2 border-indigo-800 rounded-2xl px-2.5 py-1.5 text-center shadow-sm">
                    <div class="text-[9px] font-bold text-indigo-200 leading-none">LEVEL</div>
                    <div id="levelDisplay" class="font-game text-lg leading-tight">1</div>
                </div>

                <!-- 음소거 버튼 -->
                <button id="muteBtn" aria-label="음소거 토글" class="bg-white/90 hover:bg-slate-100 active:scale-95 border-2 border-slate-700 rounded-2xl w-10 h-10 flex items-center justify-center text-lg shadow-sm transition">
                    🔊
                </button>
            </div>
        </header>

        <!-- HTML5 게임 캔버스 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 모바일 / 터치 하단 컨트롤 바 (게임 플레이 중 표시) -->
        <div id="touchControls" class="hidden absolute bottom-3 left-3 right-3 z-20 flex items-center justify-between gap-3 pointer-events-none">
            <button id="btnLeft" class="btn-control pointer-events-auto flex-1 h-16 bg-white/85 backdrop-blur-sm border-2 border-slate-700 rounded-2xl flex items-center justify-center text-3xl text-slate-800 active:bg-slate-200">
                ◀
            </button>
            <div class="text-[11px] font-bold text-slate-600/80 bg-white/60 px-2.5 py-1 rounded-full text-center leading-tight">
                터치 드래그<br>또는 버튼 이동
            </div>
            <button id="btnRight" class="btn-control pointer-events-auto flex-1 h-16 bg-white/85 backdrop-blur-sm border-2 border-slate-700 rounded-2xl flex items-center justify-center text-3xl text-slate-800 active:bg-slate-200">
                ▶
            </button>
        </div>

        <!-- 시작 화면 오버레이 -->
        <div id="startScreen" class="absolute inset-0 z-30 bg-slate-900/45 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-white border-4 border-slate-800 rounded-3xl p-6 sm:p-8 w-full max-w-sm shadow-2xl">
                <div class="text-6xl sm:text-7xl mb-2 animate-float inline-block">💩</div>
                <h1 class="font-game text-4xl sm:text-5xl text-amber-900 tracking-tight mb-1">똥피하기</h1>
                <p class="text-sm font-bold text-amber-600 mb-5">하늘에서 떨어지는 똥을 피해 살아남으세요!</p>

                <!-- 아이템 및 조작 안내 카드 -->
                <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3.5 mb-5 text-left space-y-2.5 text-xs sm:text-sm">
                    <div class="flex items-center gap-2.5">
                        <span class="bg-slate-200 text-slate-800 font-bold px-2 py-0.5 rounded-lg text-xs">조작</span>
                        <span class="text-slate-700 font-medium">키보드 <b>← → / A D</b> 또는 화면 터치</span>
                    </div>
                    <div class="border-t border-slate-200 pt-2 grid grid-cols-3 gap-1.5 text-center">
                        <div class="bg-gradient-to-b from-amber-100 to-yellow-50 border-2 border-amber-400 rounded-xl p-1.5 shadow-xs relative overflow-hidden">
                            <div class="w-9 h-9 mx-auto mb-1 rounded-full bg-amber-300/60 border-2 border-dashed border-amber-500 flex items-center justify-center text-lg shadow-inner">
                                💩✨
                            </div>
                            <div class="font-bold text-amber-900 text-[11px]">황금똥</div>
                            <span class="inline-block bg-amber-500 text-white font-bold text-[9px] px-1.5 py-0.2 rounded-full mt-0.5">+50점</span>
                        </div>
                        <div class="bg-gradient-to-b from-sky-100 to-cyan-50 border-2 border-sky-400 rounded-xl p-1.5 shadow-xs relative overflow-hidden">
                            <div class="w-9 h-9 mx-auto mb-1 rounded-full bg-sky-300/60 border-2 border-dashed border-sky-500 flex items-center justify-center text-lg shadow-inner">
                                🧻
                            </div>
                            <div class="font-bold text-sky-900 text-[11px]">두루마리 휴지</div>
                            <span class="inline-block bg-sky-500 text-white font-bold text-[9px] px-1.5 py-0.2 rounded-full mt-0.5">방어막</span>
                        </div>
                        <div class="bg-gradient-to-b from-emerald-100 to-lime-50 border-2 border-emerald-400 rounded-xl p-1.5 shadow-xs relative overflow-hidden">
                            <div class="w-9 h-9 mx-auto mb-1 rounded-full bg-emerald-300/60 border-2 border-dashed border-emerald-500 flex items-center justify-center text-lg shadow-inner">
                                👟
                            </div>
                            <div class="font-bold text-emerald-900 text-[11px]">운동화</div>
                            <span class="inline-block bg-emerald-500 text-white font-bold text-[9px] px-1.5 py-0.2 rounded-full mt-0.5">스피드</span>
                        </div>
                    </div>
                </div>

                <!-- 최고 기록 배지 -->
                <div class="mb-5 inline-flex items-center gap-2 bg-amber-100 border-2 border-amber-400 px-4 py-1.5 rounded-full">
                    <span class="text-base">🏆</span>
                    <span class="text-xs font-bold text-amber-900">최고 기록:</span>
                    <span id="startHighScore" class="font-game text-lg text-amber-700">0점</span>
                </div>

                <button id="startBtn" class="btn-arcade w-full py-4 bg-amber-500 hover:bg-amber-400 text-white text-2xl rounded-2xl border-2 border-amber-800 cursor-pointer">
                    게임 시작!
                </button>
            </div>
        </div>

        <!-- 게임 오버 화면 오버레이 -->
        <div id="gameOverScreen" class="hidden absolute inset-0 z-30 bg-slate-900/60 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-white border-4 border-slate-800 rounded-3xl p-6 sm:p-8 w-full max-w-sm shadow-2xl">
                <div id="newRecordBadge" class="hidden animate-pulse-fast inline-block bg-rose-500 text-white font-game text-sm px-3.5 py-1 rounded-full border-2 border-rose-700 mb-2 shadow-sm">
                    🎉 신기록 달성! 🎉
                </div>
                <div class="text-6xl mb-2">😵💩</div>
                <h2 class="font-game text-4xl text-slate-800 mb-4">으악! 밟았다!</h2>

                <div class="bg-slate-100 border-2 border-slate-300 rounded-2xl p-4 mb-6 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold text-slate-500">최종 점수</span>
                        <span id="finalScore" class="font-game text-3xl text-slate-800">0점</span>
                    </div>
                    <div class="border-t border-slate-200 pt-2 flex justify-between items-center">
                        <span class="text-sm font-bold text-amber-600">👑 최고 기록</span>
                        <span id="finalHighScore" class="font-game text-xl text-amber-700">0점</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                        <span>도달 레벨</span>
                        <span id="finalLevel" class="font-bold text-indigo-600">Level 1</span>
                    </div>
                </div>

                <button id="restartBtn" class="btn-arcade w-full py-4 bg-amber-500 hover:bg-amber-400 text-white text-2xl rounded-2xl border-2 border-amber-800 cursor-pointer">
                    다시 하기 🔄
                </button>
            </div>
        </div>

    </div>

    <script>
        /**
         * ============================================================================
         * 1. 사운드 매니저 (Web Audio API 기반 외부 파일 없는 합성 효과음)
         * ============================================================================
         */
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.isMuted = localStorage.getItem('poopDodgeMuted') === 'true';
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                localStorage.setItem('poopDodgeMuted', this.isMuted);
                return this.isMuted;
            }

            playTone(freq, type, duration, vol = 0.15, slideFreq = null) {
                if (this.isMuted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                    }

                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // 오디오 컨텍스트 예외 무시
                }
            }

            playStart() {
                this.playTone(330, 'triangle', 0.12, 0.2);
                setTimeout(() => this.playTone(440, 'triangle', 0.12, 0.2), 90);
                setTimeout(() => this.playTone(660, 'triangle', 0.22, 0.25), 180);
            }

            playDodgeScore() {
                this.playTone(580, 'sine', 0.06, 0.04, 720);
            }

            playItem(type) {
                if (type === 'gold') {
                    this.playTone(587.33, 'sine', 0.1, 0.2);
                    setTimeout(() => this.playTone(880, 'sine', 0.25, 0.25), 80);
                } else if (type === 'shield') {
                    this.playTone(400, 'triangle', 0.12, 0.2, 600);
                    setTimeout(() => this.playTone(750, 'triangle', 0.2, 0.2), 100);
                } else if (type === 'speed') {
                    this.playTone(440, 'sawtooth', 0.08, 0.12, 660);
                    setTimeout(() => this.playTone(660, 'sawtooth', 0.14, 0.15, 990), 70);
                }
            }

            playShieldBlock() {
                this.playTone(320, 'square', 0.12, 0.2, 160);
                setTimeout(() => this.playTone(480, 'sine', 0.18, 0.2), 80);
            }

            playLevelUp() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((n, i) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.15, 0.15), i * 75);
                });
            }

            playHit() {
                // 코믹하고 묵직한 피격음
                this.playTone(180, 'sawtooth', 0.35, 0.3, 45);
                setTimeout(() => this.playTone(110, 'square', 0.3, 0.25, 35), 60);
            }
        }

        /**
         * ============================================================================
         * 2. 메인 게임 엔진 및 상태 관리
         * ============================================================================
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sound = new SoundManager();

        // UI DOM 요소 참조
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const shieldBadge = document.getElementById('shieldBadge');
        const speedBadge = document.getElementById('speedBadge');
        const muteBtn = document.getElementById('muteBtn');
        const touchControls = document.getElementById('touchControls');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startHighScore = document.getElementById('startHighScore');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');
        const finalLevel = document.getElementById('finalLevel');
        const newRecordBadge = document.getElementById('newRecordBadge');

        // 게임 상태 변수
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let width = 0;
        let height = 0;
        let groundY = 0;
        let animationFrameId = null;
        let lastTime = 0;

        // 점수 및 진행도
        let score = 0;
        let highScore = parseInt(localStorage.getItem('poopDodgeHighScore') || '0', 10);
        let level = 1;
        let survivalTimer = 0;

        // 화면 흔들림 (Screen Shake) & 플래시 효과
        let shakeTime = 0;
        let shakeIntensity = 0;
        let flashAlpha = 0;
        let flashColor = '#ffffff';

        // 플레이어 객체
        const player = {
            x: 0,
            y: 0,
            radius: 22,
            baseSpeed: 360, // 초당 픽셀 이동 속도
            vx: 0,
            facing: 1, // 1: 오른쪽, -1: 왼쪽
            walkCycle: 0,
            hasShield: false,
            speedBoostTimer: 0,
            invincibleTimer: 0
        };

        // 입력 상태
        const keys = {
            left: false,
            right: false
        };
        let isDragging = false;
        let dragTargetX = null;

        // 게임 오브젝트 배열
        let poops = [];
        let items = [];
        let particles = [];
        let floatingTexts = [];
        let clouds = [];

        // 스폰 타이머
        let poopSpawnTimer = 0;
        let itemSpawnTimer = 0;

        /**
         * ============================================================================
         * 3. 초기화 및 리사이즈 처리
         * ============================================================================
         */
        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            const rect = wrapper.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = rect.width;
            height = rect.height;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // 하단 컨트롤 바 공간을 고려한 지면 위치 설정
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || width < 640;
            groundY = isTouchDevice ? height - 92 : height - 48;

            if (player.x === 0) {
                player.x = width / 2;
            } else {
                player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
            }
            player.y = groundY - player.radius;

            // 배경 구름 초기화
            if (clouds.length === 0) {
                for (let i = 0; i < 4; i++) {
                    clouds.push({
                        x: Math.random() * width,
                        y: 60 + Math.random() * 140,
                        speed: 12 + Math.random() * 18,
                        scale: 0.7 + Math.random() * 0.5
                    });
                }
            }
        }

        function updateMuteUI() {
            muteBtn.textContent = sound.isMuted ? '🔇' : '🔊';
        }

        function updateHUD() {
            scoreDisplay.textContent = score.toLocaleString();
            highScoreDisplay.textContent = highScore.toLocaleString();
            startHighScore.textContent = `${highScore.toLocaleString()}점`;
            levelDisplay.textContent = level;

            shieldBadge.classList.toggle('hidden', !player.hasShield);
            speedBadge.classList.toggle('hidden', player.speedBoostTimer <= 0);
        }

        function resetGame() {
            score = 0;
            level = 1;
            survivalTimer = 0;
            poopSpawnTimer = 0;
            itemSpawnTimer = 3.5; // 첫 아이템 등장 시간

            poops = [];
            items = [];
            particles = [];
            floatingTexts = [];

            player.x = width / 2;
            player.y = groundY - player.radius;
            player.vx = 0;
            player.hasShield = false;
            player.speedBoostTimer = 0;
            player.invincibleTimer = 0;

            shakeTime = 0;
            flashAlpha = 0;

            updateHUD();
        }

        function startGame() {
            sound.init();
            sound.playStart();
            resetGame();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            touchControls.classList.remove('hidden');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            sound.playHit();
            triggerShake(0.45, 14);
            triggerFlash('#ef4444', 0.35);

            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('poopDodgeHighScore', highScore.toString());
                isNewRecord = true;
            }

            updateHUD();
            touchControls.classList.add('hidden');

            finalScore.textContent = `${score.toLocaleString()}점`;
            finalHighScore.textContent = `${highScore.toLocaleString()}점`;
            finalLevel.textContent = `Level ${level}`;
            newRecordBadge.classList.toggle('hidden', !isNewRecord);

            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 350);
        }

        /**
         * ============================================================================
         * 4. 연출 헬퍼 (파티클, 플로팅 텍스트, 화면 흔들림)
         * ============================================================================
         */
        function triggerShake(duration, intensity) {
            shakeTime = duration;
            shakeIntensity = intensity;
        }

        function triggerFlash(color, alpha) {
            flashColor = color;
            flashAlpha = alpha;
        }

        function spawnParticles(x, y, color, count = 10, speedScale = 1) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const speed = (60 + Math.random() * 140) * speedScale;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 60,
                    radius: 3 + Math.random() * 4,
                    color,
                    alpha: 1,
                    life: 0.4 + Math.random() * 0.3,
                    maxLife: 0.7
                });
            }
        }

        function spawnFloatingText(x, y, text, color = '#1e293b') {
            floatingTexts.push({
                x,
                y,
                text,
                color,
                vy: -55,
                alpha: 1,
                life: 0.9
            });
        }

        /**
         * ============================================================================
         * 5. 스폰 및 물리 업데이트 로직
         * ============================================================================
         */
        function spawnPoop() {
            const radius = 17 + Math.random() * 6;
            const margin = radius + 8;
            const x = margin + Math.random() * (width - margin * 2);

            // 레벨에 따른 낙하 속도 증가
            const baseFallSpeed = 230 + (level - 1) * 38;
            const vy = baseFallSpeed * (0.88 + Math.random() * 0.32);

            // 높은 레벨에서는 약간의 좌우 흔들림 추가
            const vx = level >= 3 ? (Math.random() - 0.5) * (30 + level * 6) : 0;

            poops.push({
                x,
                y: -radius * 2,
                radius,
                vx,
                vy,
                rotation: (Math.random() - 0.5) * 0.3,
                rotSpeed: (Math.random() - 0.5) * 2.5
            });
        }

        function spawnItem() {
            const types = [
                {
                    type: 'gold',
                    label: '+50',
                    primaryColor: '#fbbf24',
                    glowColor: 'rgba(251, 191, 36, 0.72)',
                    ringColor: '#d97706',
                    badgeBg: '#b45309',
                    radius: 23, // 일반 똥보다 약 1.2배 큼
                    weight: 50
                },
                {
                    type: 'shield',
                    label: '방어막',
                    primaryColor: '#38bdf8',
                    glowColor: 'rgba(56, 189, 248, 0.72)',
                    ringColor: '#0284c7',
                    badgeBg: '#0369a1',
                    radius: 21,
                    weight: 25
                },
                {
                    type: 'speed',
                    label: '스피드',
                    primaryColor: '#34d399',
                    glowColor: 'rgba(52, 211, 153, 0.72)',
                    ringColor: '#059669',
                    badgeBg: '#047857',
                    radius: 21,
                    weight: 25
                }
            ];

            const roll = Math.random() * 100;
            let selected = types[0];
            if (roll < 50) selected = types[0];
            else if (roll < 75) selected = types[1];
            else selected = types[2];

            const radius = selected.radius;
            const margin = radius + 22;
            const x = margin + Math.random() * (width - margin * 2);

            items.push({
                x,
                y: -radius * 2.5,
                radius,
                vy: 175 + Math.random() * 45,
                type: selected.type,
                label: selected.label,
                color: selected.primaryColor,
                glowColor: selected.glowColor,
                ringColor: selected.ringColor,
                badgeBg: selected.badgeBg,
                pulse: 0,
                spinAngle: 0,
                sparkleTimer: 0
            });
        }

        function update(dt) {
            // 구름 이동 (모든 상태에서 배경 애니메이션 유지)
            for (const c of clouds) {
                c.x += c.speed * dt;
                if (c.x - 80 > width) {
                    c.x = -80;
                }
            }

            // 화면 흔들림 및 플래시 감쇠
            if (shakeTime > 0) {
                shakeTime = Math.max(0, shakeTime - dt);
            }
            if (flashAlpha > 0) {
                flashAlpha = Math.max(0, flashAlpha - dt * 1.5);
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.vy += 320 * dt; // 중력
                pt.life -= dt;
                pt.alpha = Math.max(0, pt.life / pt.maxLife);
                if (pt.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 플로팅 텍스트 업데이트
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy * dt;
                ft.life -= dt;
                ft.alpha = Math.min(1, ft.life * 1.5);
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }

            if (gameState !== 'PLAYING') return;

            // 생존 시간 및 레벨업 체크 (10초마다 레벨 증가)
            survivalTimer += dt;
            const newLevel = Math.floor(survivalTimer / 10) + 1;
            if (newLevel > level) {
                level = newLevel;
                sound.playLevelUp();
                spawnFloatingText(width / 2, height * 0.35, `LEVEL ${level}! 🔥`, '#4f46e5');
                updateHUD();
            }

            // 플레이어 버프 및 무적 타이머 갱신
            if (player.speedBoostTimer > 0) {
                player.speedBoostTimer = Math.max(0, player.speedBoostTimer - dt);
                if (player.speedBoostTimer === 0) updateHUD();
            }
            if (player.invincibleTimer > 0) {
                player.invincibleTimer = Math.max(0, player.invincibleTimer - dt);
            }

            // 플레이어 좌우 이동 계산
            const currentSpeed = player.baseSpeed * (player.speedBoostTimer > 0 ? 1.45 : 1.0);
            let moveDir = 0;

            if (keys.left && !keys.right) moveDir = -1;
            else if (keys.right && !keys.left) moveDir = 1;
            else if (isDragging && dragTargetX !== null) {
                const diff = dragTargetX - player.x;
                if (Math.abs(diff) > 4) {
                    moveDir = Math.sign(diff);
                    const step = Math.min(Math.abs(diff), currentSpeed * dt);
                    player.x += moveDir * step;
                    player.vx = moveDir * currentSpeed;
                    player.facing = moveDir;
                    player.walkCycle += dt * 14;
                } else {
                    player.vx = 0;
                }
            }

            if (!isDragging || dragTargetX === null) {
                if (moveDir !== 0) {
                    player.vx = moveDir * currentSpeed;
                    player.x += player.vx * dt;
                    player.facing = moveDir;
                    player.walkCycle += dt * 14;
                } else {
                    player.vx = 0;
                    player.walkCycle = 0;
                }
            }

            // 화면 양끝 경계 제한
            player.x = Math.max(player.radius + 4, Math.min(width - player.radius - 4, player.x));
            player.y = groundY - player.radius;

            // 똥 스폰 타이머
            const spawnInterval = Math.max(0.18, 0.72 - (level - 1) * 0.065);
            poopSpawnTimer -= dt;
            if (poopSpawnTimer <= 0) {
                spawnPoop();
                // 높은 레벨에서는 간헐적으로 2개 동시 낙하
                if (level >= 4 && Math.random() < 0.25) {
                    spawnPoop();
                }
                poopSpawnTimer = spawnInterval * (0.75 + Math.random() * 0.5);
            }

            // 특수 아이템 스폰 타이머
            itemSpawnTimer -= dt;
            if (itemSpawnTimer <= 0) {
                spawnItem();
                itemSpawnTimer = 5.5 + Math.random() * 3.5;
            }

            // 똥 이동 및 충돌/바닥 판정
            for (let i = poops.length - 1; i >= 0; i--) {
                const p = poops[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rotation += p.rotSpeed * dt;

                // 벽 튕김 처리
                if (p.x - p.radius < 0) {
                    p.x = p.radius;
                    p.vx = Math.abs(p.vx);
                } else if (p.x + p.radius > width) {
                    p.x = width - p.radius;
                    p.vx = -Math.abs(p.vx);
                }

                // 플레이어와 충돌 판정 (관대한 히트박스를 위해 반지름의 82% 적용)
                const dx = p.x - player.x;
                const dy = p.y - player.y;
                const dist = Math.hypot(dx, dy);
                const hitDist = (p.radius + player.radius) * 0.82;

                if (dist < hitDist && player.invincibleTimer <= 0) {
                    if (player.hasShield) {
                        // 휴지 방어막으로 1회 방어!
                        player.hasShield = false;
                        player.invincibleTimer = 0.8;
                        sound.playShieldBlock();
                        triggerShake(0.2, 8);
                        triggerFlash('#38bdf8', 0.25);
                        spawnParticles(p.x, p.y, '#38bdf8', 16, 1.2);
                        spawnFloatingText(player.x, player.y - 32, '휴지로 막았다! 🧻', '#0284c7');
                        updateHUD();
                        poops.splice(i, 1);
                        continue;
                    } else {
                        // 게임 오버
                        spawnParticles(player.x, player.y, '#78350f', 24, 1.4);
                        triggerGameOver();
                        return;
                    }
                }

                // 바닥에 닿으면 점수 획득 및 똥 튀김 파티클
                if (p.y + p.radius * 0.6 >= groundY) {
                    score += 10;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('poopDodgeHighScore', highScore.toString());
                    }
                    sound.playDodgeScore();
                    spawnParticles(p.x, groundY - 2, '#78350f', 6, 0.7);
                    updateHUD();
                    poops.splice(i, 1);
                }
            }

            // 아이템 이동 및 획득 판정
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.vy * dt;
                item.pulse += dt * 6;
                item.spinAngle += dt * 2.4;

                // 떨어지는 동안 주기적으로 반짝이는 잔상 파티클 생성
                item.sparkleTimer += dt;
                if (item.sparkleTimer >= 0.14) {
                    item.sparkleTimer = 0;
                    particles.push({
                        x: item.x + (Math.random() - 0.5) * item.radius * 1.4,
                        y: item.y + (Math.random() - 0.5) * item.radius * 1.4,
                        vx: (Math.random() - 0.5) * 20,
                        vy: -15 - Math.random() * 20,
                        radius: 2.2 + Math.random() * 2,
                        color: item.type === 'gold' ? '#fef08a' : item.color,
                        alpha: 0.9,
                        life: 0.35,
                        maxLife: 0.35
                    });
                }

                const dx = item.x - player.x;
                const dy = item.y - player.y;
                const dist = Math.hypot(dx, dy);

                if (dist < item.radius + player.radius + 4) {
                    sound.playItem(item.type);
                    spawnParticles(item.x, item.y, item.color, 18, 1.25);

                    if (item.type === 'gold') {
                        score += 50;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('poopDodgeHighScore', highScore.toString());
                        }
                        spawnFloatingText(item.x, item.y - 24, '+50점! 🌟', '#b45309');
                    } else if (item.type === 'shield') {
                        player.hasShield = true;
                        spawnFloatingText(item.x, item.y - 24, '방어막 획득! 🧻', '#0369a1');
                    } else if (item.type === 'speed') {
                        player.speedBoostTimer = 7.0;
                        spawnFloatingText(item.x, item.y - 24, '스피드 UP! 👟', '#047857');
                    }

                    updateHUD();
                    items.splice(i, 1);
                    continue;
                }

                // 바닥에 닿으면 소멸
                if (item.y - item.radius > groundY) {
                    items.splice(i, 1);
                }
            }
        }

        /**
         * ============================================================================
         * 6. 렌더링 (Canvas 그래픽)
         * ============================================================================
         */
        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.arc(22, -6, 28, 0, Math.PI * 2);
            ctx.arc(46, 0, 22, 0, Math.PI * 2);
            ctx.arc(22, 10, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawGround() {
            // 잔디 윗부분
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, groundY, width, 14);

            // 잔디 하이라이트 선
            ctx.fillStyle = '#86efac';
            ctx.fillRect(0, groundY, width, 4);

            // 흙 아랫부분
            ctx.fillStyle = '#d97706';
            ctx.fillRect(0, groundY + 14, width, height - groundY - 14);

            // 지면 경계선
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // 무적 상태 깜빡임
            if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer * 16) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // 바닥 그림자
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.beginPath();
            ctx.ellipse(0, player.radius, player.radius * 0.85, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 스피드 버프 잔상 오라
            if (player.speedBoostTimer > 0) {
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.radius + 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 다리 애니메이션
            const legSwing = Math.sin(player.walkCycle) * 6;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';

            // 왼쪽 다리
            ctx.beginPath();
            ctx.moveTo(-7, 10);
            ctx.lineTo(-9 + legSwing, player.radius - 1);
            ctx.stroke();

            // 오른쪽 다리
            ctx.beginPath();
            ctx.moveTo(7, 10);
            ctx.lineTo(9 - legSwing, player.radius - 1);
            ctx.stroke();

            // 몸통/머리 (귀여운 노란 병아리/캐릭터 스타일)
            const bounce = Math.abs(Math.sin(player.walkCycle)) * 2.5;
            ctx.translate(0, -bounce);

            ctx.fillStyle = '#fde047';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 볼터치
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.arc(-10, 4, 3.5, 0, Math.PI * 2);
            ctx.arc(10, 4, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // 눈 (바라보는 방향에 따라 시선 이동)
            const eyeOffsetX = player.facing * 3.5;
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-6 + eyeOffsetX, -3, 2.8, 0, Math.PI * 2);
            ctx.arc(6 + eyeOffsetX, -3, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // 눈 반짝임
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6.8 + eyeOffsetX, -3.8, 1, 0, Math.PI * 2);
            ctx.arc(5.2 + eyeOffsetX, -3.8, 1, 0, Math.PI * 2);
            ctx.fill();

            // 입 (긴장한 표정 또는 웃는 표정)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            if (gameState === 'GAMEOVER') {
                // 게임 오버 시 'ㅅ' 입
                ctx.moveTo(-4 + eyeOffsetX, 7);
                ctx.lineTo(eyeOffsetX, 3);
                ctx.lineTo(4 + eyeOffsetX, 7);
            } else {
                // 플레이 중 귀여운 미소
                ctx.arc(eyeOffsetX, 3, 4, 0.1 * Math.PI, 0.9 * Math.PI);
            }
            ctx.stroke();

            // 휴지 방어막 버블 효과
            if (player.hasShield) {
                ctx.strokeStyle = '#0284c7';
                ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.arc(0, 0, player.radius + 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();
        }

        function drawPoop(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);

            // 일반 똥은 차분한 다크 브라운 톤으로 그려 빛나는 특수 아이템과 극명한 명도/채도 대비 형성
            const r = p.radius;

            // 은은한 어두운 그림자 테두리
            ctx.fillStyle = 'rgba(41, 22, 10, 0.25)';
            ctx.beginPath();
            ctx.arc(0, 2, r * 0.95, 0, Math.PI * 2);
            ctx.fill();

            // 3단 똥 소용돌이 벡터 그래픽 (차분한 다크 브라운)
            const darkBrown = '#5c3317';
            const midBrown = '#6f3e1d';
            const outlineColor = '#2e1607';

            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 2.2;
            ctx.lineJoin = 'round';

            // 하단 단
            ctx.fillStyle = darkBrown;
            ctx.beginPath();
            ctx.roundRect(-r * 0.92, r * 0.12, r * 1.84, r * 0.68, r * 0.34);
            ctx.fill();
            ctx.stroke();

            // 중단 단
            ctx.fillStyle = midBrown;
            ctx.beginPath();
            ctx.roundRect(-r * 0.68, -r * 0.36, r * 1.36, r * 0.56, r * 0.28);
            ctx.fill();
            ctx.stroke();

            // 상단 꼭지
            ctx.fillStyle = darkBrown;
            ctx.beginPath();
            ctx.moveTo(-r * 0.38, -r * 0.32);
            ctx.quadraticCurveTo(-r * 0.35, -r * 0.85, r * 0.12, -r * 0.95);
            ctx.quadraticCurveTo(r * 0.05, -r * 0.68, r * 0.4, -r * 0.32);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 찌푸린 표정 눈 (위험 요소임을 직관적으로 전달)
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-r * 0.32, r * 0.32);
            ctx.lineTo(-r * 0.12, r * 0.42);
            ctx.moveTo(r * 0.32, r * 0.32);
            ctx.lineTo(r * 0.12, r * 0.42);
            ctx.stroke();

            ctx.restore();
        }

        // 십자 스파클(✦) 그리기 헬퍼
        function drawSparkleStar(x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawItem(item) {
            ctx.save();
            ctx.translate(item.x, item.y);

            const pulseScale = 1 + Math.sin(item.pulse) * 0.08;
            const auraRadius = item.radius * 1.85;

            // 1. 고대비 방사형 후광 (Radial Gradient Glow)
            const radGrad = ctx.createRadialGradient(0, 0, item.radius * 0.2, 0, 0, auraRadius);
            radGrad.addColorStop(0, '#ffffff');
            radGrad.addColorStop(0.45, item.glowColor);
            radGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = radGrad;
            ctx.beginPath();
            ctx.arc(0, 0, auraRadius * pulseScale, 0, Math.PI * 2);
            ctx.fill();

            // 2. 밝은 원형 배경 배지
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.beginPath();
            ctx.arc(0, 0, item.radius + 3, 0, Math.PI * 2);
            ctx.fill();

            // 3. 회전하는 점선 외곽 링 (Spinning Dashed Ring)
            ctx.save();
            ctx.rotate(item.spinAngle);
            ctx.strokeStyle = item.ringColor;
            ctx.lineWidth = 3;
            ctx.setLineDash([7, 5]);
            ctx.beginPath();
            ctx.arc(0, 0, item.radius + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 4. 아이템별 전용 고시인성 그래픽 렌더링
            ctx.save();
            ctx.scale(pulseScale, pulseScale);

            if (item.type === 'gold') {
                // 황금똥: 눈부신 골드 그라데이션 3단 똥 + 광택 하이라이트 + 스파클(✦)
                const r = item.radius * 0.92;
                const goldGrad = ctx.createLinearGradient(-r, -r, r, r);
                goldGrad.addColorStop(0, '#fef08a');
                goldGrad.addColorStop(0.45, '#f59e0b');
                goldGrad.addColorStop(1, '#b45309');

                ctx.fillStyle = goldGrad;
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2.2;

                // 하단
                ctx.beginPath();
                ctx.roundRect(-r * 0.92, r * 0.12, r * 1.84, r * 0.68, r * 0.34);
                ctx.fill();
                ctx.stroke();

                // 중단
                ctx.beginPath();
                ctx.roundRect(-r * 0.68, -r * 0.36, r * 1.36, r * 0.56, r * 0.28);
                ctx.fill();
                ctx.stroke();

                // 상단 꼭지
                ctx.beginPath();
                ctx.moveTo(-r * 0.38, -r * 0.32);
                ctx.quadraticCurveTo(-r * 0.35, -r * 0.85, r * 0.12, -r * 0.95);
                ctx.quadraticCurveTo(r * 0.05, -r * 0.68, r * 0.4, -r * 0.32);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 반짝이는 흰색 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.ellipse(-r * 0.35, r * 0.32, r * 0.22, r * 0.09, -0.2, 0, Math.PI * 2);
                ctx.ellipse(-r * 0.22, -r * 0.14, r * 0.16, r * 0.07, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // 좌우 반짝이는 십자(✦) 스파클
                const sparkleScale = 0.8 + Math.abs(Math.sin(item.pulse * 1.5)) * 0.5;
                drawSparkleStar(-r * 1.05, -r * 0.65, 7 * sparkleScale, '#fef08a');
                drawSparkleStar(r * 1.05, r * 0.45, 6 * sparkleScale, '#ffffff');

            } else if (item.type === 'shield') {
                // 두루마리 휴지: 선명한 하늘색 보호막 오라 + 펄럭이는 휴지 꼬리 + 이모지
                const wave = Math.sin(item.pulse * 1.6) * 3;
                ctx.fillStyle = '#f8fafc';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(4, 2);
                ctx.quadraticCurveTo(15, 6 + wave, 17, 15 + wave);
                ctx.lineTo(4, 15 + wave * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.font = `${Math.round(item.radius * 1.45)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🧻', -1, 1);

            } else if (item.type === 'speed') {
                // 운동화: 생동감 있는 스피드 라인 + 선명한 운동화 아이콘
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-16, -6);
                ctx.lineTo(-9, -6);
                ctx.moveTo(-18, 1);
                ctx.lineTo(-10, 1);
                ctx.moveTo(-15, 8);
                ctx.lineTo(-8, 8);
                ctx.stroke();

                ctx.font = `${Math.round(item.radius * 1.45)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👟', 2, 1);
            }
            ctx.restore();

            // 5. 아이템 상단 플로팅 알약 라벨 배지 (+50, 방어막, 스피드)
            const badgeY = -item.radius - 15;
            ctx.font = 'bold 11px "Noto Sans KR", sans-serif';
            const textMetrics = ctx.measureText(item.label);
            const padX = 7;
            const badgeW = textMetrics.width + padX * 2;
            const badgeH = 17;

            ctx.fillStyle = item.badgeBg;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.roundRect(-badgeW / 2, badgeY - badgeH / 2, badgeW, badgeH, badgeH / 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.label, 0, badgeY + 0.5);

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            ctx.save();
            // 화면 흔들림 적용
            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeIntensity * 2;
                const dy = (Math.random() - 0.5) * shakeIntensity * 2;
                ctx.translate(dx, dy);
            }

            // 배경 구름 렌더링
            for (const c of clouds) {
                drawCloud(c.x, c.y, c.scale);
            }

            // 지면 렌더링
            drawGround();

            // 플레이어 렌더링
            drawPlayer();

            // 떨어지는 똥 렌더링
            for (const p of poops) {
                drawPoop(p);
            }

            // 떨어지는 특수 아이템 렌더링
            for (const item of items) {
                drawItem(item);
            }

            // 파티클 렌더링
            for (const pt of particles) {
                ctx.save();
                ctx.globalAlpha = pt.alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 플로팅 점수/텍스트 렌더링
            for (const ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = '900 16px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            ctx.restore();

            // 피격/방어 화면 플래시 오버레이
            if (flashAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = flashAlpha;
                ctx.fillStyle = flashColor;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 7. 메인 게임 루프 및 이벤트 리스너 등록
         * ============================================================================
         */
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // 프레임 드랍 방어
            lastTime = timestamp;

            update(dt);
            render();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // 키보드 입력 이벤트
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
                isDragging = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
                isDragging = false;
            } else if ((e.key === ' ' || e.key === 'Enter') && gameState !== 'PLAYING') {
                startGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
        });

        // 캔버스 터치/마우스 드래그 조작
        function updateDragPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            dragTargetX = clientX - rect.left;
        }

        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            isDragging = true;
            updateDragPosition(e.touches[0].clientX);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || gameState !== 'PLAYING') return;
            updateDragPosition(e.touches[0].clientX);
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            dragTargetX = null;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'PLAYING') return;
            isDragging = true;
            updateDragPosition(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || gameState !== 'PLAYING') return;
            updateDragPosition(e.clientX);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            dragTargetX = null;
        });

        // 하단 모바일 좌/우 버튼 바인딩
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        const bindControlBtn = (btn, dirKey) => {
            const press = (e) => {
                e.preventDefault();
                keys[dirKey] = true;
                isDragging = false;
                btn.classList.add('active');
            };
            const release = (e) => {
                e.preventDefault();
                keys[dirKey] = false;
                btn.classList.remove('active');
            };
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        };

        bindControlBtn(btnLeft, 'left');
        bindControlBtn(btnRight, 'right');

        // UI 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        muteBtn.addEventListener('click', () => {
            sound.toggleMute();
            updateMuteUI();
        });

        // 화면 크기 변경 대응
        window.addEventListener('resize', resizeCanvas);

        // 페이지 로드 완료 시 초기화 및 루프 시작
        window.onload = function () {
            updateMuteUI();
            updateHUD();
            resizeCanvas();
            animationFrameId = requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
